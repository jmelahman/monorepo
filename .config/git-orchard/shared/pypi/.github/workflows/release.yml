  # Shared by Go subtrees published to PyPI as wheels:
  # .config/git-orchard/shared/pypi in the monorepo.
  # Every wheel builds before any is published, so a failed platform can't
  # leave a release half-uploaded.
  build-pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        os-arch:
          - {goos: "linux", goarch: "amd64"}
          - {goos: "linux", goarch: "arm64"}
          - {goos: "windows", goarch: "amd64"}
          - {goos: "windows", goarch: "arm64"}
          - {goos: "darwin", goarch: "amd64"}
          - {goos: "darwin", goarch: "arm64"}
          - {goos: "", goarch: ""}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: stable
          cache: false
      - name: Set up the subtree
        if: hashFiles('.github/ci-setup.sh') != ''
        run: .github/ci-setup.sh
      - uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          enable-cache: false
      - env:
          MATRIX_GOOS: ${{ matrix.os-arch.goos }}
          MATRIX_GOARCH: ${{ matrix.os-arch.goarch }}
        run: |
          GOOS="$MATRIX_GOOS" \
          GOARCH="$MATRIX_GOARCH" \
          uv build --wheel --build-constraints build-constraints.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.os-arch.goos || 'any' }}-${{ matrix.os-arch.goarch || 'any' }}
          path: dist/*.whl
          if-no-files-found: error
  publish-pypi:
    needs: build-pypi
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - run: uv publish dist/*
