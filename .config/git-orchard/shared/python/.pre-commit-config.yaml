  # Python. ruff reads only the source, so it runs from its own hook. ty and
  # pytest need the project's packages, so they run from uv.lock with
  # --locked: a stale lockfile fails the hook instead of being re-resolved.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # frozen: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 6972e4c5a7e9f45f05a2f30b668f221f43b770c9  # frozen: v0.0.84
    hooks:
      - id: ty
        args: [--locked]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --locked --quiet pytest
        language: python
        additional_dependencies: [uv==0.9.15]
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
