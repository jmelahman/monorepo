  # Python. ruff reads only the source, so it runs from its own hook. ty and
  # pytest need the project's packages, so they run from uv.lock with
  # --locked: a stale lockfile fails the hook instead of being re-resolved.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 18b2b8bb1b9b90d2d21283756e89b07fc9c747bf  # frozen: v0.0.95
    hooks:
      - id: ty
        args: [--locked]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --locked --quiet pytest
        language: python
        additional_dependencies: [uv==0.13.6]
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
