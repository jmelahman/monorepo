version: 2
updates:
  # Subtrees have no dependabot.yml of their own: updates land here and reach
  # the mirrors through git orchard push. Each entry covers the directories the
  # subtrees' own configs did, and groups them so a bump lands in one PR.
  - package-ecosystem: "github-actions"
    directories:
      - /
      - /*
      - /pre-commit-hooks/*
      - /templates/*
      # The workflows git orchard sync copies into the subtrees. Bumping the
      # source in the same PR as its copies keeps the git-orchard-sync hook
      # passing.
      - /.config/git-orchard/shared/*
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependabot:actions"
    cooldown:
      default-days: 7
    groups:
      actions:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - /5-wild
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependabot:npm"
    cooldown:
      default-days: 7
    groups:
      # react and react-dom must be bumped in lockstep — a version skew
      # trips React error #527 ("Incompatible React versions") at startup.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Every other minor and patch bump lands as one PR, so no
      # two open PRs rewrite the same lockfile. Majors stay one PR each. A
      # dependency joins the first group it matches, so react stays above.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directories:
      - /agentic-kanban/docs
      - /agentic-kanban/web
      - /agilecbt/docs
      - /agilecbt/web
      - /local-preview/docs
      - /local-preview/web
      - /templates/fullstack-template/docs
      - /templates/fullstack-template/web
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependabot:bun"
    cooldown:
      default-days: 7
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Every other minor and patch bump lands as one PR across the
      # directories, so no two open PRs rewrite the same bun.lock. Majors
      # stay one PR each: they are reviewed one at a time anyway. A
      # dependency joins the first group it matches, so react stays above.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - /agentic-kanban/build/devcontainer
      - /templates/fullstack-template
      - /templates/fullstack-template/.devcontainer
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependabot:docker"
    cooldown:
      default-days: 7
    groups:
      devcontainer:
        group-by: dependency-name
        patterns:
          - "*"
