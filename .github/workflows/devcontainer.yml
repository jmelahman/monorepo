name: Devcontainer

on:
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Build without cache"
        type: boolean
        default: true
  push:
    branches:
      - master
    paths:
      - templates/fullstack-template/.devcontainer/**
      - docker-bake.hcl
      - .github/workflows/devcontainer.yml

permissions: {}

concurrency:
  group: devcontainer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: bake
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f
        with:
          # Build from the checkout rather than bake-action's default remote
          # Git context.
          source: .
          targets: devcontainer
          push: true
          pull: true
          no-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.no-cache }}
