name: Devcontainer

on:
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Build without cache"
        type: boolean
        default: true
  push:
    branches:
      - master
    paths:
      - templates/fullstack-template/.devcontainer/**
      - templates/godot-template/.devcontainer/**
      - templates/godot-template/.dockerignore
      - templates/godot-template/scripts/env.sh
      - templates/godot-template/scripts/setup.sh
      - templates/godot-template/scripts/versions.env
      - tools/containers/**
      - docker-bake.hcl
      - .github/workflows/devcontainer.yml

permissions: {}

concurrency:
  group: devcontainer
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # godot-devcontainer is built FROM devcontainer through a bake
          # `contexts` link, so the two have to share one bake invocation.
          - name: devcontainer
            targets: devcontainer,godot-devcontainer
          - name: android
            targets: android-builder
          # Epic's base image is private to accounts linked to Epic Games, which
          # GITHUB_TOKEN isn't, and it is large enough to need the runner's disk.
          - name: unreal
            targets: unreal-devcontainer
            epic: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Free disk space
        if: matrix.epic
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Log in to GHCR
        if: ${{ !matrix.epic }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One ghcr.io login has to both pull Epic's image and push ours, so this
      # takes a personal access token (read:packages, write:packages) from an
      # account that is a member of the EpicGames organization.
      - name: Log in to GHCR with Epic access
        if: matrix.epic
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.EPIC_GHCR_TOKEN }}
      - name: Build and push
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          # Build from the checkout rather than bake-action's default remote
          # Git context.
          source: .
          targets: ${{ matrix.targets }}
          push: true
          pull: true
          no-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.no-cache }}
