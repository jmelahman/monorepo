name: Mirror

on:
  push:
    branches:
      - master
    tags:
      # `*` does not match `/` in GitHub filters; `**` covers nested prefixes.
      - "**/v*"

permissions: {}

# No concurrency group: each run publishes the splits of its own commit, and
# pushes never force, so an older run finishing last is rejected rather than
# rolling an upstream back. Queueing instead would let GitHub drop a pending
# run, and with it the only --changed-since range covering its commits.
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jmelahman/git-orchard@05a021adff171d3ac1c7aa6cc863be17e7611d51 # ratchet:jmelahman/git-orchard@v1
        with:
          # Created and stored by `git orchard github-app`; the App is
          # installed on the mirror repositories.
          app-client-id: ${{ vars.ORCHARD_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.ORCHARD_APP_PRIVATE_KEY }}
