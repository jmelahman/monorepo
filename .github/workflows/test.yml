name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # ratchet:actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: false
      - uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # ratchet:astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: go install "solod.dev/cmd/so@$(sed -n 's/^SOLOD_VERSION = "\(.*\)"$/\1/p' hatch_build.py)"
      # Both toolchains build and test the same sources; the hook list in
      # .pre-commit-config.yaml is the single definition of "the checks".
      - run: PATH="$(go env GOPATH)/bin:$PATH" uvx prek@0.3.8 run --all-files
      # so build regenerates so/test/main.go and writes binaries; a dirty
      # tree here means a generated file was not committed.
      - run: git diff --exit-code
