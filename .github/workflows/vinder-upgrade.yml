name: Upgrade vendored dependencies

# Dependabot for the vinder projects, which Dependabot itself can't serve:
# it would bump package.json and the lockfile but leave vendor/ stale, and
# `vinder check` would fail the PR. `vinder upgrade --all` bumps direct
# dependencies to their latest releases, re-resolves every lockfile so
# transitive dependencies move too, regenerates vendor/, and aligns the
# projects on one version of each package they share. The PR body is its
# report.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: vinder-upgrade

jobs:
  upgrade:
    runs-on: ubuntu-latest
    # The App's token pushes the branch and opens the PR; GITHUB_TOKEN only
    # reads.
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Each project's own package manager installs its dependencies; bun is
      # text-editor's. A project on another one needs it set up here too.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      # Builds vinder from its own source at this ref, runs `upgrade --all`
      # and `audit --all` (advisories go in the PR rather than failing it),
      # and opens the PR as the App `vinder github-app` created: one opened
      # with GITHUB_TOKEN would not trigger the pre-commit checks. Keep it on
      # the release the pre-commit hooks pin, in .pre-commit-config.yaml.
      - name: Upgrade
        uses: jmelahman/vinder@v0.1.4
        with:
          app-client-id: ${{ vars.VINDER_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.VINDER_APP_PRIVATE_KEY }}
