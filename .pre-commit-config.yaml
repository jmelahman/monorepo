default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

# In workspace mode this root project sees every file in the tree, subtrees
# included. Skip bytes that are meant to be exactly what they are: vendored
# upstream text, minified output, and test fixtures.
exclude: |
  (?x)^(
    .*/testdata/.*|
    .*/test/fixtures/.*|
    .*\.min\.(css|js)|
    pkglint/site/assets/fonts/.*
  )$

repos:
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86  # frozen: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$

  # Go. Only file-scoped hooks live here: the module-scoped ones (go-vet,
  # go-mod-tidy, go-test, golangci-lint, govulncheck) have to run from a
  # module root, so they belong in each module's own config, where prek's
  # workspace mode runs them from that directory.
  - repo: https://github.com/jmelahman/go-pre-commit-hooks
    rev: 4148d5ef186eb979ccf07d9052101b312b0f025c  # frozen: v1.1.0
    hooks:
      - id: gofmt
        args: [-s]

  # Python. ruff reads only the source, so it runs from its own hook. ty and
  # pytest need the project's packages, so they run from uv.lock; the hook
  # environment pins only uv itself, so nothing comes off the host PATH.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # frozen: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 569ddf04117761eb74cef7afb5143bbb96fcdfbb  # frozen: 0.9.15
    hooks:
      - id: uv-sync

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --locked --quiet ty check
        language: python
        additional_dependencies: [uv==0.9.15]
        types_or: [python, pyi]
        require_serial: true

      - id: pytest
        name: pytest
        entry: uv run --locked --quiet pytest
        language: python
        additional_dependencies: [uv==0.9.15]
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

  # Shell.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=style]

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt -w -s
        language: golang
        additional_dependencies:
          - mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
        types: [shell]

  # GitHub Actions.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: go-work-sync
        name: go work sync
        entry: go work sync
        language: golang
        files: (^|/)go\.(work|mod|sum)$
        pass_filenames: false
