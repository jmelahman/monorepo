version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependabot:actions"

  # The Android wrapper's Gradle dependencies are deliberately absent: most of
  # them live in the generated capacitor.build.gradle, which `cap sync` rewrites
  # from the npm packages below. Bumping them here would be undone on the next
  # sync at best, and desynced from the Capacitor runtime at worst.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependabot:npm"
