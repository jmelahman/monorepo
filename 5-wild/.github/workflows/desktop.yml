name: Desktop

# Builds the Godot desktop port (godot/) for Linux and Windows, both from one
# Ubuntu runner: Godot exports any platform from any host, and the one native
# piece, the QuickJS extension, cross-compiles to a .dll with mingw-w64. It
# links nothing past KERNEL32 and msvcrt, so the zip carries no MinGW runtime.
# macOS is left out on purpose: its .dylib would need a macOS runner, and an
# unsigned, un-notarized .app is one Gatekeeper calls "damaged" and refuses to
# open, which is a download that only works after a Terminal incantation.
#
# Every push that touches the port builds both zips as workflow artifacts, so a
# break shows up at the commit that caused it. A `v*` tag also attaches them to
# that tag's GitHub release, beside the APK.
on:
  push:
    branches:
      - master
    # Path filters are not applied to tag pushes, so a release always builds.
    tags:
      - "v*"
    paths:
      - godot/**
      - src/**
      - public/words/**
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - godot/**
      - src/**
      - public/words/**
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # No cache, as in android.yml and for its reason: these zips are what a
      # player runs, and a restored cache is writable by any pull request.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: ""
      # Godot, the addons, the apt packages, the Linux .so, the engine bundle
      # and the first import, all at the pins in godot/scripts/versions.env.
      - name: Set up the Godot project
        run: godot/scripts/ci-setup.sh
      - name: Build the Windows extension
        run: godot/scripts/build-native.sh windows
      # 1.3 GB from Godot's releases page, checked against its sha256. Not
      # cached, for the reason setup-node is not: the download is verified, but
      # the few minutes saved are not worth a cache in the release path.
      - name: Install the export templates
        run: godot/scripts/setup.sh templates
      - name: Export
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: VERSION=${VERSION:-${GITHUB_SHA::7}} godot/scripts/export.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 5-wild-desktop
          path: godot/build/*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Covers the wait below with room to spare; the APK build takes minutes.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: 5-wild-desktop
      # This job attaches to the release and never creates it. android.yml
      # creates it only once a signed APK exists, which is what keeps
      # /releases/latest/download/5-wild.apk pointing at a version that has one;
      # a desktop build finishing first and creating it would break that, and
      # two jobs both creating it would race. A release made by GITHUB_TOKEN
      # triggers no workflow, so there is no event to wait on: this polls. If
      # the APK never ships, neither do these, and the job times out saying so.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          until gh release view "$TAG" >/dev/null 2>&1; do
            echo "no release for $TAG yet; waiting on android.yml"
            sleep 30
          done
      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" ./*.zip --clobber
