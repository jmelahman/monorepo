name: Desktop

# Builds the Tauri shell (desktop/) around the web build, for Linux and
# Windows. Unlike the Godot port this replaced, nothing here cross-compiles:
# the bundle links the platform's own webview, WebKitGTK or WebView2, so each
# platform builds on its own runner. macOS is left out on purpose: an unsigned,
# un-notarized .app is one Gatekeeper calls "damaged" and refuses to open,
# which is a download that only works after a Terminal incantation.
#
# Every push that touches the shell or the game builds both as workflow
# artifacts, so a break shows up at the commit that caused it. A `v*` tag also
# attaches them to that tag's GitHub release, beside the APK.
on:
  push:
    branches:
      - master
    # Path filters are not applied to tag pushes, so a release always builds.
    tags:
      - "v*"
    paths:
      - desktop/**
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: an AppImage runs on any glibc at least as new as
          # the one it was built against, so the oldest supported runner is the
          # widest reach.
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # No cache, as in android.yml and for its reason: these builds are what a
      # player runs, and a restored cache is writable by any pull request.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: ""
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # zizmor: ignore[cache-poisoning]
        with:
          no-cache: true
      # WebKitGTK and what Tauri's bundler needs, per its prerequisites page,
      # plus GStreamer's base and good plugins: WebKitGTK plays audio through
      # GStreamer, the game's audio is Ogg Vorbis, and the AppImage bundles
      # whatever plugins the runner has (`bundleMediaFramework`), so these are
      # the difference between an AppImage with sound and one without.
      - name: Install the Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      # The runners ship rustup; this only makes the toolchain explicit.
      - run: rustup toolchain install stable --profile minimal
      # `npm run build` is `tsc --noEmit && vite build`, into dist/, which
      # tauri.conf.json embeds as `frontendDist`.
      - run: npm ci
      - run: npm run build
      - name: Build the shell
        working-directory: desktop
        run: |
          bun install --frozen-lockfile
          bun run tauri build
      # Stable names, as the APK has, so a download link can name the file
      # without a version in it. Tauri's own carry the product name, space and
      # all, and the version.
      - name: Collect the bundles
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir out
          bundle=desktop/src-tauri/target/release/bundle
          if [ "$PLATFORM" = linux ]; then
            cp "$bundle"/appimage/*.AppImage out/5-wild-linux-x86_64.AppImage
            cp "$bundle"/deb/*.deb out/5-wild-linux-amd64.deb
          else
            cp "$bundle"/nsis/*-setup.exe out/5-wild-windows-setup.exe
          fi
          ls -la out
      # One artifact per platform, since an artifact downloads as a zip of its
      # files: a single one holding both made every player download the other
      # platform's build as well.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 5-wild-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Covers the wait below with room to spare; the APK build takes minutes.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: 5-wild-*
          merge-multiple: true
      # This job attaches to the release and never creates it. android.yml
      # creates it only once a signed APK exists, which is what keeps
      # /releases/latest/download/5-wild.apk pointing at a version that has one;
      # a desktop build finishing first and creating it would break that, and
      # two jobs both creating it would race. A release made by GITHUB_TOKEN
      # triggers no workflow, so there is no event to wait on: this polls. If
      # the APK never ships, neither do these, and the job times out saying so.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          until gh release view "$TAG" >/dev/null 2>&1; do
            echo "no release for $TAG yet; waiting on android.yml"
            sleep 30
          done
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" ./5-wild-* --clobber
