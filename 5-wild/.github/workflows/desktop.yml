name: Desktop

# Builds the Tauri shell (desktop/) around the web build, for Linux and
# Windows. Unlike the Godot port this replaced, nothing here cross-compiles:
# the bundle links the platform's own webview, WebKitGTK or WebView2, so each
# platform builds on its own runner. macOS is left out on purpose: an unsigned,
# un-notarized .app is one Gatekeeper calls "damaged" and refuses to open,
# which is a download that only works after a Terminal incantation.
#
# Every push that touches the shell or the game builds both as workflow
# artifacts, so a break shows up at the commit that caused it. A `v*` tag also
# attaches them to that tag's GitHub release, beside the APK.
on:
  push:
    branches:
      - master
    # Path filters are not applied to tag pushes, so a release always builds.
    tags:
      - "v*"
    paths:
      - desktop/**
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: an AppImage runs on any glibc at least as new as
          # the one it was built against, so the oldest supported runner is the
          # widest reach.
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    # Whether this leg sends its installer to SignPath: Windows, a release, and
    # only once the SignPath project exists, so until its variable is set the
    # workflow ships unsigned exactly as before rather than failing. Linux has
    # nothing to sign; a distro checks a package's repository, not the file.
    #
    # Not `SIGN`, which it was, and which cost the Linux build: appimagetool
    # GPG-signs whenever `SIGN` is *set*, whatever it holds, so `SIGN: false`
    # asked it to sign with a key the runner does not have, and it aborted
    # with "Signing failed". Environment variables are one namespace shared
    # with every tool a step runs, so this one is named for what it is.
    env:
      TO_SIGNPATH: ${{ matrix.platform == 'windows' && github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    defaults:
      run:
        shell: bash
    steps:
      # Full history, for the tags in it: the version the build stamps is the
      # newest `v*` tag behind HEAD, and a one-commit clone has none to find.
      # See `version` in vite.config.ts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # No cache, as in android.yml and for its reason: these builds are what a
      # player runs, and a restored cache is writable by any pull request.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: ""
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # zizmor: ignore[cache-poisoning]
        with:
          no-cache: true
      # WebKitGTK and what Tauri's bundler needs, per its prerequisites page,
      # plus GStreamer's base and good plugins: WebKitGTK plays audio through
      # GStreamer, the game's audio is Ogg Vorbis, and the AppImage bundles
      # whatever plugins the runner has (`bundleMediaFramework`), so these are
      # the difference between an AppImage with sound and one without.
      - name: Install the Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      # The runners ship rustup; this only makes the toolchain explicit.
      - run: rustup toolchain install stable --profile minimal
      # `npm run build` is `tsc --noEmit && vite build`, into dist/, which
      # tauri.conf.json embeds as `frontendDist`.
      - run: npm ci
      - run: npm run build
      # --verbose because without it the bundler swallows linuxdeploy's output,
      # and a failed AppImage says only "failed to run linuxdeploy". That was
      # all the first failure here said; the real cause (see TO_SIGNPATH above)
      # was two lines of appimagetool's that only --verbose prints.
      #
      # The version is the tag's, handed over as a config patch, because
      # tauri.conf.json has nowhere to read it from now that package.json holds
      # none, and left alone Tauri falls back to Cargo.toml's 0.0.0. It is the
      # same lookup vite.config.ts makes for the title screen, so the installer
      # and the game it installs agree on their number.
      - name: Build the shell
        working-directory: desktop
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          bun install --frozen-lockfile
          bun run tauri build --verbose --config "{\"version\":\"${tag#v}\"}"
      # Stable names, as the APK has, so a download link can name the file
      # without a version in it. Tauri's own carry the product name, space and
      # all, and the version.
      #
      # Linux ships three ways, one per kind of player. The binary is 9 MB and
      # the one the README links: it uses the system's WebKitGTK and GStreamer,
      # which a desktop distro already has. It ships in a tarball because
      # nothing else carries the executable bit: a download is only bytes, so a
      # bare binary lands mode 644 and needs a chmod before it runs, while tar
      # keeps the mode and a double-click or `tar xz` restores it. The deb is
      # the same binary with its dependencies declared, so apt fetches what is
      # missing. The AppImage carries its own copies of both, 91 MB of them,
      # for a system where neither is an option, such as the Steam Deck's
      # read-only root.
      - name: Collect the bundles
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir out
          bundle=desktop/src-tauri/target/release/bundle
          if [ "$PLATFORM" = linux ]; then
            tar -czf out/5-wild-linux-x86_64.tar.gz --owner=0 --group=0 \
              -C desktop/src-tauri/target/release 5-wild
            cp "$bundle"/appimage/*.AppImage out/5-wild-linux-x86_64.AppImage
            cp "$bundle"/deb/*.deb out/5-wild-linux-amd64.deb
          else
            cp "$bundle"/nsis/*-setup.exe out/5-wild-windows-setup.exe
          fi
          ls -la out
      # One artifact per platform, since an artifact downloads as a zip of its
      # files: a single one holding both made every player download the other
      # platform's build as well.
      #
      # A build headed for signing uploads under a name the publish job does not
      # match, so the unsigned installer can never be the one that ships.
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.TO_SIGNPATH == 'true' && 'unsigned-windows' || format('5-wild-{0}', matrix.platform) }}
          path: out/*
          if-no-files-found: error
      # SignPath Foundation signs open-source releases for free, with its own
      # certificate, so the publisher Windows names is "SignPath Foundation"
      # rather than us. It fetches the artifact from GitHub itself and checks
      # it was built here by this workflow, which is its whole trust model, and
      # a release signing request waits for a person to approve it in
      # SignPath's UI: hence the hour, and a wait on a runner rather than a
      # second job, since a public repository's minutes are free.
      #
      # Only the installer is signed, not the 5-wild.exe inside it. SmartScreen
      # judges what was downloaded, which is the installer; signing the inner
      # binary too would mean a second request, and a second approval, from
      # inside `tauri build`.
      - name: Sign the installer
        if: env.TO_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 5-wild
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - if: env.TO_SIGNPATH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 5-wild-windows
          path: signed/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Covers the wait below with room to spare; the APK build takes minutes.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: 5-wild-*
          merge-multiple: true
      # This job attaches to the release and never creates it. android.yml
      # creates it only once a signed APK exists, which is what keeps
      # /releases/latest/download/5-wild.apk pointing at a version that has one;
      # a desktop build finishing first and creating it would break that, and
      # two jobs both creating it would race. A release made by GITHUB_TOKEN
      # triggers no workflow, so there is no event to wait on: this polls. If
      # the APK never ships, neither do these, and the job times out saying so.
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          until gh release view "$TAG" >/dev/null 2>&1; do
            echo "no release for $TAG yet; waiting on android.yml"
            sleep 30
          done
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" ./5-wild-* --clobber
