[devcontainer]
image = "ghcr.io/jmelahman/devcontainer:latest"

[[task]]
label = "Run"
container_port = 5173

# Only opens the forward: kanban's proxy dials the container port per
# connection and outlives the task, and the feed itself belongs to the MCP
# server the agent runs, which would lose the port to anything bound here.
[[task]]
label = "Spectator feed"
container_port = 7777

# A downloadable, installable debug APK for this commit. The Android image has
# JDK 21 and the SDK; install Bun because `bun run apk` builds the web assets
# before Capacitor syncs and packages them.
# Schema: https://jmelahman.github.io/local-preview/reference/preview-toml
[previews.artifacts.apk]
path  = "."
image = "ghcr.io/jmelahman/android-builder:latest"
build = [
  ["bun", "install", "--frozen-lockfile"],
  ["bun", "run", "apk"],
  ["cp", "android/app/build/outputs/apk/debug/app-debug.apk", "5-wild.apk"],
]
files = ["5-wild.apk"]
