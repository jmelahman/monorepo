default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

# The music is a deliberate 1.3MB, over check-added-large-files' 500KB. It will
# not go under without Opus at 24kbps, which smears the piano and moves the
# samples its seamless loop depends on.
exclude: ^src/ui/tracks/.*\.ogg$

hide_status: [passed, skipped]

repos:
  # BEGIN orchard:base
  # Shared by every subtree: .config/git-orchard/shared/base in the monorepo
  # (https://github.com/jmelahman/monorepo). Edit it there; `git orchard sync`
  # copies it here.
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86  # frozen: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
  # END orchard:base

  # BEGIN orchard:shell
  # Shared by subtrees with shell scripts: .config/git-orchard/shared/shell in
  # the monorepo.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=style]

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt -w -s
        language: golang
        # shfmt's go.mod needs Go 1.26, and a local hook gets no version
        # inferred, so without this prek builds it with CI's older Go.
        language_version: ">=1.26"
        additional_dependencies:
          - mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
        types: [shell]
  # END orchard:shell

  # BEGIN orchard:web
  # Shared by bun web subtrees: .config/git-orchard/shared/web in the monorepo.
  # prek installs bun into each hook's own environment, so CI needs no
  # setup-bun. A local hook gets only its additional_dependencies there, not
  # the subtree's node_modules, so bun-install fills those first. It always
  # runs, since a fresh checkout has none whatever changed, and is a no-op once
  # they're current. The rest share a priority and run concurrently after it.
  - repo: local
    hooks:
      - id: bun-install
        name: bun install
        entry: bun install --frozen-lockfile --silent
        language: bun
        pass_filenames: false
        always_run: true
        priority: 0
        # And on checkout, so switching to a branch with another bun.lock
        # leaves node_modules matching it rather than waiting for a commit.
        stages: [pre-commit, post-checkout]
      - id: bun-typecheck
        name: typecheck
        entry: bun run typecheck
        language: bun
        files: \.(ts|tsx|js|mjs|json)$|^bun\.lock$
        pass_filenames: false
        priority: 1
      - id: bun-check
        name: biome check
        entry: bun run check
        language: bun
        pass_filenames: false
        priority: 1
      # --bun runs vitest on bun's JavaScriptCore rather than Node, which the
      # golden vectors were generated under: Node rounds some floats
      # differently (32.955000000000005 against 32.955).
      - id: bun-test
        name: test
        entry: bun --bun run test
        language: bun
        files: \.(ts|tsx|js|mjs|json|jsonc|css)$|^bun\.lock$
        pass_filenames: false
        priority: 1
  # END orchard:web
