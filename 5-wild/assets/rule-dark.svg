<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1" viewBox="0 0 1 1" preserveAspectRatio="none">
  <!--
    The README's rule, for a dark page. GitHub draws every hr at .25em and strips
    any style that would change it, so this stands in for one at .125em: an image
    keeps its width and height attributes, and preserveAspectRatio="none" lets
    the README stretch this single pixel to full width at 2px. The colour is
    GitHub's own dark-theme border, so it reads as the native rule, only thinner.
  -->
  <rect width="1" height="1" fill="#3d444d"/>
</svg>
