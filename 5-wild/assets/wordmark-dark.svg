<svg xmlns="http://www.w3.org/2000/svg" width="414" height="138" viewBox="0 0 414 138"
     role="img" aria-label="5 Wild">
  <title>5 Wild</title>
  <!--
    The README's masthead, for a dark page: the title screen's name drawn
    again as the row being played, the 5 in green and the rest in the gray of a
    letter the board has read, with chips times mult slapped on the corner. See
    `.title-mast` in src/style.css for why each piece is what it is; this file
    only copies the answers. The README picks between this and its twin with
    prefers-color-scheme, so the background is left transparent.

    On a dark page the tiles are the app's own: the table's gray and green,
    dropped onto the page with the stylesheet's black shadow.

    Measurements are the stylesheet's at its cap: 62px tiles, 6px gaps, letters
    at 0.58 of a tile.
  -->
  <defs>
    <clipPath id="t0"><rect x="40" y="40" width="62" height="62" rx="6"/></clipPath>
    <clipPath id="t1"><rect x="108" y="40" width="62" height="62" rx="6"/></clipPath>
    <clipPath id="t2"><rect x="176" y="40" width="62" height="62" rx="6"/></clipPath>
    <clipPath id="t3"><rect x="244" y="40" width="62" height="62" rx="6"/></clipPath>
    <clipPath id="t4"><rect x="312" y="40" width="62" height="62" rx="6"/></clipPath>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#538d4e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Each tile is its fill plus a dark band along the bottom edge, clipped to
       the tile, which is the stylesheet's inset shadow. -->
  <g filter="url(#glow)">
    <g clip-path="url(#t0)">
      <rect x="40" y="40" width="62" height="62" fill="#538d4e"/>
      <rect x="40" y="97" width="62" height="5" fill="#000" opacity="0.22"/>
    </g>
  </g>
  <g filter="url(#drop)">
    <g clip-path="url(#t1)">
      <rect x="108" y="40" width="62" height="62" fill="#3a3a3c"/>
      <rect x="108" y="97" width="62" height="5" fill="#000" opacity="0.3"/>
    </g>
    <g clip-path="url(#t2)">
      <rect x="176" y="40" width="62" height="62" fill="#3a3a3c"/>
      <rect x="176" y="97" width="62" height="5" fill="#000" opacity="0.3"/>
    </g>
    <g clip-path="url(#t3)">
      <rect x="244" y="40" width="62" height="62" fill="#3a3a3c"/>
      <rect x="244" y="97" width="62" height="5" fill="#000" opacity="0.3"/>
    </g>
    <g clip-path="url(#t4)">
      <rect x="312" y="40" width="62" height="62" fill="#3a3a3c"/>
      <rect x="312" y="97" width="62" height="5" fill="#000" opacity="0.3"/>
    </g>
  </g>
  <g fill="#e8e8ea" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="900" text-anchor="middle">
    <text x="71" y="82">5</text>
    <text x="139" y="82">W</text>
    <text x="207" y="82">I</text>
    <text x="275" y="82">L</text>
    <text x="343" y="82">D</text>
  </g>

  <!-- Chips times mult at the stylesheet's 6deg tilt. Dark figures on the two
       score colours, which are bright enough to carry them on either page. -->
  <g transform="rotate(6 342 35)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">
    <rect x="296" y="24" width="50" height="23" rx="6" fill="#4a9eff"/>
    <text x="321" y="40" font-size="13" fill="#0e0f13">+120</text>
    <text x="355" y="40" font-size="12" fill="#8b8d98">×</text>
    <rect x="364" y="24" width="24" height="23" rx="6" fill="#ff5c5c"/>
    <text x="376" y="40" font-size="13" fill="#0e0f13">4</text>
  </g>
</svg>
