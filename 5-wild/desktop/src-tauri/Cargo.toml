[package]
name = "five-wild"
version = "0.0.0"
edition = "2024"
description = "5 Wild, a word-guessing roguelike"
publish = false

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-opener = "2.6.0"
tauri-plugin-single-instance = "2.5.0"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

# The binary is most of the download, and nothing here is hot enough to miss
# what size optimization gives up.
[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1
