name: Devcontainer

# Rebuilds the personal dev sandbox image (.devcontainer/Dockerfile) and
# pushes it to Docker Hub as lahmanja/devcontainer:latest. After a run, pin
# the printed digest in .devcontainer/devcontainer.json and the CI container
# images in test.yml / release.yml.
#
# Not to be confused with the release.yml `devcontainer` job, which builds
# the builtin session image (build/devcontainer -> lahmanja/kanban-devcontainer).

on:
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Build without cache"
        type: boolean
        default: true
  push:
    branches:
      - master
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .devcontainer
          # amd64 only: the ripsecrets install step has no arm64 prebuilt binary.
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.no-cache }}
          tags: lahmanja/devcontainer:latest
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pushed lahmanja/devcontainer@${DIGEST}"
          echo "\`lahmanja/devcontainer@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
