default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite
repos:
  # BEGIN orchard:base
  # Shared by every subtree: .config/git-orchard/shared/base in the monorepo
  # (https://github.com/jmelahman/monorepo). Edit it there; `git orchard sync`
  # copies it here.
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86  # frozen: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
  # END orchard:base

  # BEGIN orchard:go
  # Shared by Go subtrees: .config/git-orchard/shared/go in the monorepo. The
  # module-scoped hooks run from this directory, the module root.
  - repo: https://github.com/jmelahman/go-pre-commit-hooks
    rev: c843811864d03fc517b10d29199efe6167ecfc72  # frozen: v1.3.0
    hooks:
      - id: gofmt
        args: [-s]
      - id: go-mod-tidy
      - id: go-vet
      - id: go-test
      - id: go-get

  - repo: https://github.com/golangci/golangci-lint
    rev: 114493f9b3e7257d29e4130f2b4a4aadefbb6845  # frozen: v2.14.0
    hooks:
      - id: golangci-lint-full
        # prek runs the monorepo's projects at once, and golangci-lint otherwise
        # refuses to start while another run holds its lock.
        args: [--allow-parallel-runners]
  # END orchard:go

  # BEGIN orchard:shell
  # Shared by subtrees with shell scripts: .config/git-orchard/shared/shell in
  # the monorepo.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=style]

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt -w -s
        language: golang
        # shfmt's go.mod needs Go 1.26, and a local hook gets no version
        # inferred, so without this prek builds it with CI's older Go.
        language_version: ">=1.26"
        additional_dependencies:
          - mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
        types: [shell]
  # END orchard:shell

  - repo: local
    hooks:
      # biome is installed via `npm install` in web/ (see web/package.json).
      # If web/node_modules is missing (fresh clone, CI), bootstrap with
      # `npm ci` so the hook works without a separate setup step — without
      # it, `npx biome` would try to resolve an unrelated `biome` package
      # from the registry. The wrapper strips the leading `web/` from each
      # path so biome — invoked inside web/ where its biome.json lives —
      # finds the files.
      - id: biome
        name: biome
        entry: bash -c 'cd web && { [ -x node_modules/.bin/biome ] || npm ci --no-audit --no-fund; } >&2 && exec node_modules/.bin/biome check --no-errors-on-unmatched "${@#web/}"' --
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|json|jsonc)$
        # Hook is invoked in parallel batches by prek when many files match;
        # without serial, concurrent `npm ci` runs race on web/node_modules
        # and corrupt the install. biome handles file parallelism itself.
        require_serial: true
      - id: govulncheck
        name: govulncheck
        entry: scripts/govulncheck.sh
        language: system
        files: ^(go\.mod|go\.sum)$
        pass_filenames: false
      - id: npm-audit
        name: npm audit
        entry: bash -c 'cd web && npm audit --audit-level=high'
        language: system
        files: ^web/package(-lock)?\.json$
        pass_filenames: false
