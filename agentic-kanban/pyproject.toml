[project]
name = "agentic-kanban"
description = "Kanban board for managing AI agent sessions"
license = { file = "LICENSE" }
authors = [{ name = "Jamison Lahman", email = "jamison@lahman.dev" }]
readme = "README.md"
requires-python = ">=3.6"
keywords = ["agentic", "agents", "claude", "claude-code", "kanban"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Go",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jmelahman/agentic-kanban"

# BEGIN orchard:manygo
# Shared by Go subtrees built into wheels with manygo:
# .config/git-orchard/shared/manygo in the monorepo
# (https://github.com/jmelahman/monorepo). Edit it there; `git orchard sync`
# copies it here.
[build-system]
# Pinned exactly; build-constraints.txt (the monorepo's pybuild profile)
# locks the transitive closure with hashes, and CI passes it to
# `uv build --build-constraints`. The monorepo's build-constraints hook
# regenerates it when a pin changes.
# go-bin must cover the newest `go` directive among these subtrees' go.mod.
requires = [
  "go-bin==1.27.2",
  "hatch-vcs==0.5.0",
  "hatchling==1.32.0",
  "manygo==0.3.0"
]
build-backend = "hatchling.build"
# END orchard:manygo

[tool.hatch.build]
include = [
  "go.mod",
  "go.sum",
  "**/*.go",
  "web/package.json",
  "web/bun.lock",
  "web/index.html",
  "web/tsconfig.json",
  "web/vite.config.ts",
  "web/src/**",
]

[tool.hatch.build.hooks.custom]
binary_name = "kanban"

[tool.hatch.version]
source = "vcs"
