<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kanban" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kanban</title>
    <script>
      (function () {
        try {
          var m = localStorage.getItem("kanban.themeMode") || "system";
          var c = localStorage.getItem("kanban.contrast") || "normal";
          var a = localStorage.getItem("kanban.accent") || "red";
          var dark =
            m === "dark" ||
            (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.dataset.theme = dark ? "dark" : "light";
          if (c === "high") r.dataset.contrast = "high";
          r.dataset.accent = a;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.accent = "red";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
