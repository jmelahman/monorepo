# AgileCBT settings for this workspace. The server reads it when started from
# the repo root; ~/.config/agilecbt/config.toml is read first, and any
# environment variable (AGILECBT_LLM_BASE_URL, AGILECBT_MODEL, ...) overrides
# both.
# See docs/guide/configuration.md.

# The host's Ollama, through its OpenAI-compatible API. Dev containers set
# AGILECBT_LLM_BASE_URL=http://ollama:11434/v1 to reach it on the Docker network.
base_url = "http://localhost:11434/v1"
model = "gemma4:26b"
