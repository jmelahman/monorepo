version: 2

before:
  hooks:
    - bun install --cwd web --frozen-lockfile
    - bun run --cwd web build

builds:
  - binary: agilecbt
    env:
      - CGO_ENABLED=0
    flags:
      - -tags=embed
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/jmelahman/agilecbt/cmd/server.version={{.Version}}
    goarch:
      - amd64
      - arm64

archives:
  - format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
