default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite
repos:
  # BEGIN orchard:base
  # Shared by every subtree: .config/git-orchard/shared/base in the monorepo
  # (https://github.com/jmelahman/monorepo). Edit it there; `git orchard sync`
  # copies it here.
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86  # frozen: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
  # END orchard:base

  # BEGIN orchard:go
  # Shared by Go subtrees: .config/git-orchard/shared/go in the monorepo. The
  # module-scoped hooks run from this directory, the module root.
  - repo: https://github.com/jmelahman/go-pre-commit-hooks
    rev: c843811864d03fc517b10d29199efe6167ecfc72  # frozen: v1.3.0
    hooks:
      - id: gofmt
        args: [-s]
      - id: go-mod-tidy
      - id: go-vet
      - id: go-test
      - id: go-get

  - repo: https://github.com/golangci/golangci-lint
    rev: 114493f9b3e7257d29e4130f2b4a4aadefbb6845  # frozen: v2.14.0
    hooks:
      - id: golangci-lint-full
        # prek runs the monorepo's projects at once, and golangci-lint otherwise
        # refuses to start while another run holds its lock.
        args: [--allow-parallel-runners]
  # END orchard:go

  # BEGIN orchard:shell
  # Shared by subtrees with shell scripts: .config/git-orchard/shared/shell in
  # the monorepo.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=style]

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt -w -s
        language: golang
        # shfmt's go.mod needs Go 1.26, and a local hook gets no version
        # inferred, so without this prek builds it with CI's older Go.
        language_version: ">=1.26"
        additional_dependencies:
          - mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
        types: [shell]
  # END orchard:shell

  - repo: local
    hooks:
      - id: govulncheck
        name: govulncheck
        entry: scripts/govulncheck.sh
        language: system
        files: ^(go\.mod|go\.sum)$
        pass_filenames: false
      # prek installs bun and biome into the hook's own environment, so these
      # need neither bun on PATH nor web/node_modules. Biome runs from web/ so
      # it picks up web/biome.json as the root config; `bun x --bun` runs its
      # node launcher under bun. Keep the pin in step with web/package.json.
      - id: biome
        name: biome
        entry: bash -c 'cd web && exec bun x --bun biome check --no-errors-on-unmatched "${@#web/}"' --
        language: bun
        additional_dependencies: ["@biomejs/biome@2.5.6"]
        files: ^web/.*\.(ts|tsx|js|jsx|json|jsonc)$
      - id: bun-audit
        name: bun audit
        entry: bun audit --cwd=web --audit-level=high
        language: bun
        files: ^web/(package\.json|bun\.lock)$
        pass_filenames: false
