services:
  agilecbt:
    image: agilecbt:local
    container_name: agilecbt
    build:
      context: .
      dockerfile: Dockerfile
      # Build metadata. Resolve on the host since .git is dockerignored and
      # worktrees only stash a gitdir pointer. Set alongside your other env
      # vars when invoking `docker compose up --build`, e.g.:
      #   VERSION=$(git describe --tags --always --dirty) \
      #   docker compose up -d --build
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Required whenever the port is reachable beyond this machine.
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      # Any OpenAI-compatible API; defaults to Ollama on the host. Set
      # APP_LLM=none to turn the coach off.
      APP_LLM: ${APP_LLM:-openai}
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_MODEL: ${APP_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The image runs as UID 65532 (nonroot) and owns /data, so a named
      # volume inherits the right permissions on first mount.
      - agilecbt-data:/data

volumes:
  agilecbt-data:
