# Hosted models on OpenRouter, for comparing the local matrix with bigger
# models. The key comes from the environment, never this file:
#
#   OPENROUTER_API_KEY=sk-or-… agilecbt eval --matrix --matrix-file evals/models.hosted.toml
#
# A full --runs 1 pass costs a few dollars, mostly the frontier models.
# Models that refuse reasoning_effort = "none" get "low"; "off" leaves the
# parameter out entirely.

# Controls: the same weights as local models, served in full precision.
[[models]]
name = "qwen/qwen3.8-27b"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[[models]]
name = "google/gemma-4-31b-it"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[[models]]
name = "mistralai/mistral-small-3.2-24b-instruct"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

# Larger open-weight models.
[[models]]
name = "openai/gpt-oss-120b"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
reasoning_effort = "low"

[[models]]
name = "deepseek/deepseek-v4.1-flash"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[[models]]
name = "z-ai/glm-5.3"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
reasoning_effort = "low"

# Frontier models.
[[models]]
name = "anthropic/claude-sonnet-5"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[[models]]
name = "google/gemini-3.8-flash"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
reasoning_effort = "low"

[[models]]
name = "openai/gpt-5.6-luna"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
