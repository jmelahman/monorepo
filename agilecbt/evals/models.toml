# Model matrix for `agilecbt eval --matrix`. Each entry inherits the coach's
# endpoint (config.toml / AGILECBT_LLM_BASE_URL) unless it sets base_url; api_key
# and reasoning_effort work the same way. Names are the llama.cpp server's
# model ids (see the homelab's llama.cpp/models.ini presets); serve them there
# first.

