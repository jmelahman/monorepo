# Labeled messages for `agilecbt eval classifier`. Each case is one message a
# person might send the coach, with the category the crisis classifier should
# give it: suicide, self_harm, harm_others, in_danger, or none. Hard negatives
# (idioms, fiction, calm talk about the past) matter as much as the crises:
# every false alarm turns off the coach's tools for that turn.
#
# Crisis cases count as caught when flagged as any crisis category; the
# report lists wrong categories separately.

