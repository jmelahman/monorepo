# BEGIN orchard:manygo
# Shared by Go subtrees built into wheels with manygo:
# .config/git-orchard/shared/manygo in the monorepo
# (https://github.com/jmelahman/monorepo). Edit it there; `git orchard sync`
# copies it here.
[build-system]
# Pinned exactly; build-constraints.txt (the monorepo's pybuild profile)
# locks the transitive closure with hashes, and CI passes it to
# `uv build --build-constraints`. The monorepo's build-constraints hook
# regenerates it when a pin changes.
# go-bin must cover the newest `go` directive among these subtrees' go.mod.
requires = ["hatchling==1.32.0", "hatch-vcs==0.5.0", "go-bin==1.27.1", "manygo==0.3.0"]
build-backend = "hatchling.build"
# END orchard:manygo

[project]
name = "agilecbt"
description = "Agile planning meets CBT: a self-hosted check-in coach for depression and anxiety"
license = {file = "LICENSE"}
authors = [{ name = "Jamison Lahman", email = "jamison@lahman.dev" }]
readme = "README.md"
requires-python = ">=3.6"
keywords = ["template", "fullstack", "go", "react", "sqlite"]
classifiers = [
    "Programming Language :: Go",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dynamic = ["version"]


[project.urls]
Repository = "https://github.com/jmelahman/fullstack-template"

[tool.hatch.build]
include = [
    "go.mod",
    "go.sum",
    "**/*.go",
    "internal/db/schema.sql",
    "web/package.json",
    "web/package-lock.json",
    "web/index.html",
    "web/tsconfig.json",
    "web/vite.config.ts",
    "web/public/**",
    "web/src/**",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.custom]
binary_name = "agilecbt"
