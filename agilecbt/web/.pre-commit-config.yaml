repos:
  - repo: local
    hooks:
      # biome is installed via `bun install` in web/ (see web/package.json).
      # If web/node_modules is missing (fresh clone, CI), bootstrap with
      # `bun install --frozen-lockfile` so the hook works without a separate setup step — without
      # it, `bunx biome` would try to resolve an unrelated `biome` package
      # from the registry. The wrapper strips the leading `web/` from each
      # path so biome — invoked inside web/ where its biome.json lives —
      # finds the files.
      - id: biome
        name: biome
        entry: bun run biome check --no-errors-on-unmatched "${@#web/}" --
        language: bun
        files: ^.*\.(ts|tsx|js|jsx|json|jsonc)$
        # Hook is invoked in parallel batches by prek when many files match;
        # without serial, concurrent installs race on web/node_modules
        # and corrupt the install. biome handles file parallelism itself.
        require_serial: true
      - id: bun-audit
        name: bun audit
        entry: bun audit --audit-level=high
        language: bun
        files: ^(package\.json|bun\.lock)$
        pass_filenames: false
