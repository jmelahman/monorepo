<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1c1917" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>AgileCBT</title>
    <script>
      // Mirrors applyTheme in src/theme.ts; runs before first paint.
      (function () {
        var r = document.documentElement;
        function get(k, ok, d) {
          try {
            var v = localStorage.getItem("agilecbt." + k);
            return ok.indexOf(v) >= 0 ? v : d;
          } catch (e) {
            return d;
          }
        }
        var m = get("themeMode", ["system", "light", "dark"], "system");
        var dark =
          m === "dark" ||
          (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        r.dataset.theme = dark ? "dark" : "light";
        r.dataset.style = get("themeStyle", ["warm", "drafting"], "warm");
        r.dataset.accent = get(
          "themeAccent",
          ["apricot", "signal", "sage", "sky", "violet"],
          "apricot",
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
