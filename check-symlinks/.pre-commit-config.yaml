# testdata/ holds broken and odd symlinks on purpose.
exclude: ^testdata/

repos:
  # BEGIN orchard:base
  # Shared by every subtree: .config/git-orchard/shared/base in the monorepo
  # (https://github.com/jmelahman/monorepo). Edit it there; `git orchard sync`
  # copies it here.
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86  # frozen: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
  # END orchard:base

  # BEGIN orchard:go
  # Shared by Go subtrees: .config/git-orchard/shared/go in the monorepo. The
  # module-scoped hooks run from this directory, the module root.
  - repo: https://github.com/jmelahman/go-pre-commit-hooks
    rev: 51820c603eaa31a81da2ff40ccb83ca2be1dd9d2  # frozen: v1.2.0
    hooks:
      - id: gofmt
        args: [-s]
      - id: go-mod-tidy
      - id: go-vet
      - id: go-test
      - id: go-get
  # END orchard:go

  # BEGIN orchard:shell
  # Shared by subtrees with shell scripts: .config/git-orchard/shared/shell in
  # the monorepo.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=style]

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt -w -s
        language: golang
        additional_dependencies:
          - mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
        types: [shell]
  # END orchard:shell

  # The Go and solod hooks set GOWORK=off: so/ has its own go.mod, and a
  # go.work further up (a monorepo checkout) would otherwise claim this module.
  # prek builds `so` itself with the Go on PATH; `so` has to be built by the
  # same Go release it runs against, so a host-installed one may not do.
  - repo: local
    hooks:
      - id: check-version
        name: version and pin consistency
        entry: scripts/check-version.sh
        language: system
        always_run: true
        pass_filenames: false
      - id: so-build
        name: build with solod
        entry: env GOWORK=off so build -o check-symlinks-so ./so
        language: golang
        additional_dependencies: [solod.dev/cmd/so@v0.3.0]  # = SOLOD_VERSION
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      - id: go-build
        name: build with go (gocompat)
        entry: env GOWORK=off go build -o check-symlinks-go .
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      - id: so-test
        name: test with solod
        entry: env GOWORK=off so test ./so
        language: golang
        additional_dependencies: [solod.dev/cmd/so@v0.3.0]  # = SOLOD_VERSION
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      # Runs after so-test on purpose: so-test regenerates so/test/main.go,
      # which this reads.
      - id: go-test-gocompat
        name: test with go (gocompat)
        entry: env GOWORK=off go -C so run -modfile=gotest.mod ./test
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
