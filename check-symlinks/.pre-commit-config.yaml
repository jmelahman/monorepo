repos:
  - repo: https://github.com/jmelahman/go-pre-commit-hooks
    rev: d4204df560ab3edc0d35a29239bda12b73c0cf03  # frozen: v1.0.0
    hooks:
      - id: gofmt
      - id: go-mod-tidy
      - id: go-vet
      # The end-to-end suite: builds the binary and drives it over testdata/.
      - id: go-test

  - repo: local
    hooks:
      - id: check-version
        name: version and pin consistency
        entry: scripts/check-version.sh
        language: system
        always_run: true
        pass_filenames: false
      - id: so-build
        name: build with solod
        entry: so build -o check-symlinks-so ./so
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      - id: go-build
        name: build with go (gocompat)
        entry: go build -o check-symlinks-go .
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      - id: so-test
        name: test with solod
        entry: so test ./so
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      # Runs after so-test on purpose: so-test regenerates so/test/main.go,
      # which this reads.
      - id: go-test-gocompat
        name: test with go (gocompat)
        entry: go -C so run -modfile=gotest.mod ./test
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
