repos:
  # BEGIN orchard:base
  # Shared by every subtree: .config/git-orchard/shared/base in the monorepo
  # (https://github.com/jmelahman/monorepo). Edit it there; `git orchard sync`
  # copies it here.
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86  # frozen: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
  # END orchard:base

  # BEGIN orchard:go
  # Shared by Go subtrees: .config/git-orchard/shared/go in the monorepo. The
  # module-scoped hooks run from this directory, the module root.
  - repo: https://github.com/jmelahman/go-pre-commit-hooks
    rev: 51820c603eaa31a81da2ff40ccb83ca2be1dd9d2  # frozen: v1.2.0
    hooks:
      - id: gofmt
        args: [-s]
      - id: go-mod-tidy
      - id: go-vet
      - id: go-test
      - id: go-get
  # END orchard:go
  # BEGIN orchard:golangci-lint
  # Shared by Go subtrees that lint clean: .config/git-orchard/shared/golangci-lint
  # in the monorepo.
  - repo: https://github.com/golangci/golangci-lint
    rev: 114493f9b3e7257d29e4130f2b4a4aadefbb6845  # frozen: v2.14.0
    hooks:
      - id: golangci-lint-full
        # prek runs the monorepo's projects at once, and golangci-lint otherwise
        # refuses to start while another run holds its lock.
        args: [--allow-parallel-runners]
  # END orchard:golangci-lint
