[build-system]
requires = ["hatchling==1.32.0", "manygo==0.3.0"]
build-backend = "hatchling.build"

[project]
name = "go-bin"
description = "Prebuilt golang binary"
license = "MIT"
license-files = ["LICENSE", "go/LICENSE"]
authors = [{ name = "Jamison Lahman", email = "jamison@lahman.dev" }]
readme = "README.md"
requires-python = ">=3.6"
keywords = [
  "golang", "go", "packaging", "binary", "prebuilt"
]
classifiers = [
    "Programming Language :: Go",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.scripts]
go = "go:main"

[project.urls]
Repository = "https://github.com/jmelahman/go-bin"

[tool.hatch.version]
source = "code"
path = "src/go/_version.py"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
# Editable installs (uv sync, and uv check behind the ty hook) just put src on
# the path; the wheel itself is assembled by hatch_build.py.
dev-mode-dirs = ["src"]

[dependency-groups]
dev = [
    # hatch_build.py imports both; installing them is what lets ty check it.
    "hatchling>=1.27.0",
    "manygo>=0.3.0",
    "pytest>=9.1.0",
]

[tool.uv.dependency-groups]
# The published wheels support back to 3.6; the build-time tooling does not.
dev = { requires-python = ">=3.10" }
