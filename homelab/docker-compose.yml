services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf
    container_name: audiobookshelf
    expose:
      - 80
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      - ./audiobooks:/audiobooks
      - ./podcasts:/podcasts
    restart: unless-stopped

  notebook:
    image: notebook:local
    build: ../notebook
    container_name: notebook
    restart: unless-stopped
    expose:
      - 8090
    # The names the dashboard is reached at; the notebook refuses others.
    command: ["--host", "${HOMELAB_IP},${NOTEBOOK_HOSTS:-}"]
    volumes:
      # Claude Code's login, shared with the host's
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
      - ./podcasts:/podcasts
      - notebook_state:/state
      # The voice model, downloaded on first use
      - notebook_cache:/root/.cache/notebook

  music:
    # Built from ../music, or pulled once the image workflow publishes it.
    image: ghcr.io/jmelahman/music
    build: ../music
    container_name: music
    restart: unless-stopped
    expose:
      - 8095
    volumes:
      # The owned library, beside the media jellyfin serves, so it plays there
      # too; synced to the phone by the host's Syncthing.
      - ~/media/music:/music
      - music_state:/state
      # The Android client's build output, served for download; the mount is
      # empty until the first build, and the endpoint answers 404.
      - ../music/android/app/build/outputs/apk/debug:/apk:ro
    # Appends to the image's entrypoint.
    command: ["--apk", "/apk/app-debug.apk"]

  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    hostname: bert
    restart: unless-stopped
    environment:
      # Rootless Docker: container root is the host user, as in the other
      # services; the image's default UID 1000 would map to a subuid with
      # no write access to the mounts below.
      - PUID=0
      - PGID=0
    volumes:
      - syncthing_config:/var/syncthing/config
      # The owned library, the same folder the music app serves and jellyfin
      # plays; synced two-way with the phone over the tailnet.
      - ~/media/music:/var/syncthing/music
    ports:
      # The GUI answers only on this machine; pairing happens from here.
      - "127.0.0.1:8384:8384"
      # Sync traffic goes direct over the tailnet; relays are off in the
      # config so nothing leaves it.
      - "22000:22000/tcp"
      - "22000:22000/udp"

  nginx:
    image: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./nginx/:/etc/nginx/:ro
      - ./dashboard/:/srv/dashboard/:ro
      # Written by the dashboard when its layout is edited
      - ./dashboard/data/:/srv/dashboard/data/
      - ../.config/git-orchard/shared/design/design/:/srv/design/:ro
      - ../image-editor/:/srv/draw/:ro
      - ../text-editor/:/srv/write/:ro
      - ../document-viewer/:/srv/view/:ro
      # Markdown the editor opens and saves in place
      - ../:/srv/files/
    depends_on:
      - notebook
      - audiobookshelf
      - jellyfin
      - pihole

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    expose:
      - 8096
      - 8920
    volumes:
      - jellyfin_data:/config
      - ~/media:/media
    environment:
      - TZ=America/Chicago

  pihole:
    image: pihole/pihole
    restart: unless-stopped
    container_name: pihole
    expose:
      - 80
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      TZ: "US/Pacific"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_upstreams: "1.1.1.2;1.0.0.2"
      # Point every nginx server_name at the docker host
      FTLCONF_dns_hosts: "${HOMELAB_IP:?set HOMELAB_IP in homelab/.env} cache.pacman.home;${HOMELAB_IP} shelf.home;${HOMELAB_IP} video.home"
      # Served by nginx at /pihole/admin/
      FTLCONF_webserver_paths_prefix: "/pihole"
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in homelab/.env}
    volumes:
      - "./etc-pihole:/etc/pihole"
    cap_add:
      - SYS_NICE
      - SYS_TIME

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama
    restart: unless-stopped
    # The AMD iGPU, for the Vulkan backend
    devices:
      - /dev/dri:/dev/dri
    # 18080 in-container and on the host, so the same URL works everywhere:
    # http://llama:18080/v1 in kanban devcontainers (docker DNS) and
    # http://localhost:18080/v1 on the host.
    expose:
      - 18080
    ports:
      - "18080:18080"
    networks:
      - default
      # agentic-kanban's devcontainers live on this network
      - kanban-net
    # Router mode: one endpoint for every model in llama.cpp/models.ini,
    # loaded on first request and swapped out when another one needs the
    # memory. The presets keep the Ollama-era ids as aliases, so existing
    # clients need no changes.
    command:
      - --models-preset
      - /etc/llama.cpp/models.ini
      - --models-max
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "18080"
    volumes:
      - ./models:/models:ro
      - ./llama.cpp/models.ini:/etc/llama.cpp/models.ini:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18080/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 5m

volumes:
  jellyfin_data:
  notebook_state:
  notebook_cache:
  music_state:
  syncthing_config:

networks:
  # Declared by the agentic-kanban compose project and shared with its
  # devcontainers, which reach the model server as http://llama:18080/v1.
  kanban-net:
    external: true
