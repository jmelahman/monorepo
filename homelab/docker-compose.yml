services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf
    container_name: audiobookshelf
    expose:
      - 80
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      - ./audiobooks:/audiobooks
      - ./podcasts:/podcasts
    restart: unless-stopped

  notebook:
    image: notebook:local
    build: ../notebook
    container_name: notebook
    restart: unless-stopped
    expose:
      - 8090
    # The names the dashboard is reached at; the notebook refuses others.
    command: ["--host", "${HOMELAB_IP},${NOTEBOOK_HOSTS:-}"]
    volumes:
      # Claude Code's login, shared with the host's
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
      - ./podcasts:/podcasts
      - notebook_state:/state
      # The voice model, downloaded on first use
      - notebook_cache:/root/.cache/notebook

  music:
    # Built from ../music, or pulled once the image workflow publishes it.
    image: ghcr.io/jmelahman/music
    build: ../music
    container_name: music
    restart: unless-stopped
    expose:
      - 8095
    # The store provider (MUSIC_STORE, a path under /store) and its
    # credentials, the Supermix's playlist id and the rest come from
    # homelab/.env, which is gitignored.
    env_file: .env
    environment:
      # Buys leave through the VPN and nothing else does: the server hands
      # the proxy to the store provider alone, so streams stay off it, and
      # a VPN that is down fails the buy rather than buying in the clear.
      - MUSIC_STORE_PROXY=http://gluetun:8888
      # .env names the cookies.txt on the host (exported from a browser
      # signed in to YouTube Music); it is mounted here. Without one the
      # mix is a radio seeded from the library.
      - MUSIC_YTM_COOKIES=/secrets/ytm-cookies.txt
    volumes:
      # The owned library, beside the media jellyfin serves, so it plays there
      # too; the phone carries what its app saves for offline.
      - ~/media/music:/music
      - music_state:/state
      # The Android client's build output, served for download; the mount is
      # empty until the first build, and the endpoint answers 404.
      - ../music/android/app/build/outputs/apk/debug:/apk:ro
      # The private store providers, kept out of the public mirror.
      - ../music/stores/_private:/store:ro
      # /dev/null (an empty file) until .env names a cookies file.
      - ${MUSIC_YTM_COOKIES:-/dev/null}:/secrets/ytm-cookies.txt:ro
    depends_on:
      - gluetun
    # Appends to the image's entrypoint.
    command: ["--apk", "/apk/app-debug.apk"]

  # Private Internet Access, for the music store provider's buys only; it
  # reaches the VPN through gluetun's HTTP proxy on 8888. The credentials
  # live in homelab/.env.
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    expose:
      - 8888
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${PIA_USER:-}
      - OPENVPN_PASSWORD=${PIA_PASSWORD:-}
      - SERVER_REGIONS=${PIA_REGION:-US East}
      - HTTPPROXY=on

  nginx:
    image: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./nginx/:/etc/nginx/:ro
      - ./dashboard/:/srv/dashboard/:ro
      # Written by the dashboard when its layout is edited
      - ./dashboard/data/:/srv/dashboard/data/
      - ../.config/git-orchard/shared/design/design/:/srv/design/:ro
      - ../image-editor/:/srv/draw/:ro
      - ../text-editor/:/srv/write/:ro
      - ../document-viewer/:/srv/view/:ro
      # Markdown the editor opens and saves in place
      - ../:/srv/files/
    depends_on:
      - notebook
      - audiobookshelf
      - jellyfin
      - pihole

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    expose:
      - 8096
      - 8920
    volumes:
      - jellyfin_data:/config
      - ~/media:/media
    environment:
      - TZ=America/Chicago

  pihole:
    image: pihole/pihole
    restart: unless-stopped
    container_name: pihole
    expose:
      - 80
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      TZ: "US/Pacific"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_upstreams: "1.1.1.2;1.0.0.2"
      # Point every nginx server_name at the docker host
      FTLCONF_dns_hosts: "${HOMELAB_IP:?set HOMELAB_IP in homelab/.env} cache.pacman.home;${HOMELAB_IP} shelf.home;${HOMELAB_IP} video.home"
      # Served by nginx at /pihole/admin/
      FTLCONF_webserver_paths_prefix: "/pihole"
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in homelab/.env}
    volumes:
      - "./etc-pihole:/etc/pihole"
    cap_add:
      - SYS_NICE
      - SYS_TIME

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama
    restart: unless-stopped
    # The AMD iGPU, for the Vulkan backend
    devices:
      - /dev/dri:/dev/dri
    # Offline: the only network is internal, so it has no route out. The
    # llama-proxy below is its way in.
    expose:
      - 18080
    networks:
      llama-internal:
        # Not "llama": the proxy answers to that on the networks it fronts,
        # and it would resolve to itself.
        aliases:
          - llama-upstream
    # Router mode: one endpoint for every model in llama.cpp/models.ini,
    # loaded on first request and swapped out when another one needs the
    # memory. The presets keep the Ollama-era ids as aliases, so existing
    # clients need no changes.
    command:
      - --models-preset
      - /etc/llama.cpp/models.ini
      - --models-max
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "18080"
    volumes:
      - ./models:/models:ro
      - ./llama.cpp/models.ini:/etc/llama.cpp/models.ini:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18080/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 5m

  # Forwards to llama, which has no network of its own to publish from.
  # 18080 in-container and on the host, so the same URL works everywhere:
  # http://llama:18080/v1 in nginx and kanban devcontainers (docker DNS) and
  # http://localhost:18080/v1 on the host.
  llama-proxy:
    image: alpine/socat
    container_name: llama-proxy
    restart: unless-stopped
    command: ["TCP-LISTEN:18080,fork,reuseaddr", "TCP:llama-upstream:18080"]
    ports:
      - "18080:18080"
    networks:
      llama-internal:
      default:
        aliases:
          - llama
      # agentic-kanban's devcontainers live on this network
      kanban-net:
        aliases:
          - llama
    depends_on:
      - llama

volumes:
  jellyfin_data:
  notebook_state:
  notebook_cache:
  music_state:

networks:
  # No route out: llama's weights are local, so it needs none.
  llama-internal:
    internal: true
  # Declared by the agentic-kanban compose project and shared with its
  # devcontainers, which reach the model server as http://llama:18080/v1.
  kanban-net:
    external: true
