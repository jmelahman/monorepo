services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf
    container_name: audiobookshelf
    expose:
      - 80
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      - ./audiobooks:/audiobooks
      - ./podcasts:/podcasts
    restart: unless-stopped

  notebook:
    image: notebook:local
    build: ../notebook
    container_name: notebook
    restart: unless-stopped
    expose:
      - 8090
    # The names the dashboard is reached at; the notebook refuses others.
    command: ["--host", "${HOMELAB_IP},${NOTEBOOK_HOSTS:-}"]
    volumes:
      # Claude Code's login, shared with the host's
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
      - ./podcasts:/podcasts
      - notebook_state:/state
      # The voice model, downloaded on first use
      - notebook_cache:/root/.cache/notebook

  nginx:
    image: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./nginx/:/etc/nginx/:ro
      - ./dashboard/:/srv/dashboard/:ro
      # Written by the dashboard when its layout is edited
      - ./dashboard/data/:/srv/dashboard/data/
      - ../image-editor/:/srv/draw/:ro
      - ../text-editor/:/srv/write/:ro
      # Markdown the editor opens and saves in place
      - ../:/srv/files/
    depends_on:
      - notebook
      - audiobookshelf
      - jellyfin
      - pihole
      - pacoloco

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    expose:
      - 8096
      - 8920
    volumes:
      - jellyfin_data:/config
      - ~/media:/media
    environment:
      - TZ=America/Los_Angeles

  pihole:
    image: pihole/pihole
    restart: unless-stopped
    container_name: pihole
    expose:
      - 80
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      TZ: "US/Pacific"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_upstreams: "1.1.1.2;1.0.0.2"
      # Point every nginx server_name at the docker host
      FTLCONF_dns_hosts: "${HOMELAB_IP:?set HOMELAB_IP in homelab/.env} cache.pacman.home;${HOMELAB_IP} shelf.home;${HOMELAB_IP} video.home"
      # Served by nginx at /pihole/admin/
      FTLCONF_webserver_paths_prefix: "/pihole"
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in homelab/.env}
    volumes:
      - "./etc-pihole:/etc/pihole"
    cap_add:
      - SYS_NICE
      - SYS_TIME

  pacoloco:
    image: ghcr.io/anatol/pacoloco
    container_name: pacoloco
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    expose:
      - 9129
    volumes:
      - pacoloco_data:/var/cache/pacoloco
      - ./pacoloco/pacoloco.yaml:/etc/pacoloco.yaml

volumes:
  jellyfin_data:
  pacoloco_data:
  notebook_state:
  notebook_cache:
