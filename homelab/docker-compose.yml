services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf
    container_name: audiobookshelf
    expose:
      - 80
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      - ./audiobooks:/audiobooks
      - ./podcasts:/podcasts
    restart: unless-stopped

  nginx:
    image: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/:/etc/nginx/:ro
    depends_on:
      - audiobookshelf
      - pihole
      - pacoloco

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    expose:
      - 8096
      - 8920
    volumes:
      - jellyfin_data:/config
      - ~/media:/media
    environment:
      - TZ=America/Los_Angeles

  pihole:
    image: pihole/pihole
    restart: unless-stopped
    container_name: pihole
    expose:
      - 80
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      TZ: "US/Pacific"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_upstreams: "1.1.1.2;1.0.0.2"
      # Point every nginx server_name at the docker host
      FTLCONF_dns_hosts: "${HOMELAB_IP:?set HOMELAB_IP in homelab/.env} cache.pacman.home;${HOMELAB_IP} shelf.home;${HOMELAB_IP} video.home"
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in homelab/.env}
    volumes:
      - "./etc-pihole:/etc/pihole"
    cap_add:
      - SYS_NICE
      - SYS_TIME

  pacoloco:
    image: ghcr.io/anatol/pacoloco
    container_name: pacoloco
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    expose:
      - 9129
    volumes:
      - pacoloco_data:/var/cache/pacoloco
      - ./pacoloco/pacoloco.yaml:/etc/pacoloco.yaml

volumes:
  jellyfin_data:
  pacoloco_data:
