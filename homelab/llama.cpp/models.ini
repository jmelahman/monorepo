; llama.cpp router presets.
;
; Each section is a model id, kept equal to the Ollama-era name so existing
; clients can request the same model without changes. Models are loaded on
; first request and unloaded when another one needs the memory.
;
; The .text.gguf files are Ollama blobs repacked by convert-ollama-gguf.py:
; Ollama had fused the vision tower into the same file, and llama.cpp wants
; it separate (or not at all).

version = 1

[*]
n-gpu-layers = 99
ctx-size = 8192
jinja = true

[gemma4:26b]
alias = gemma4:26b
model = /models/gemma4-26b.gguf
; The Ollama MTP draft blob (gemma4-26b-mtp.gguf) is kept in /models, but
; this llama.cpp build aborts in common_context_can_seq_rm when the draft is
; combined with the vision projector, so it is not wired up here.
mmproj = /models/gemma4-26b-mmproj.gguf

[gemma4:e4b]
alias = gemma4:e4b
; Text only: the vision tower was fused into the Ollama blob.
model = /models/gemma4-e4b.text.gguf

[qwen3.6:35b-a3b]
alias = qwen3.6:35b-a3b
; Text only: the vision tower was fused into the Ollama blob.
model = /models/qwen3.6-35b-a3b.text.gguf

[qwen3.8:27b]
alias = qwen3.8:27b
model = /models/qwen3.8-27b.gguf
mmproj = /models/qwen3.8-27b-mmproj.gguf

[qwen3.8:27b-q6]
alias = qwen3.8:27b-q6
; The upstream Q6_K release (netprojects/Qwen3.8-27B-opencode-adapted-GGUF)
; of the same model qwen3.8:27b was exported from.
model = /models/Qwen3.8-27B-opencode-Q6_K.gguf
mmproj = /models/qwen3.8-27b-mmproj.gguf
