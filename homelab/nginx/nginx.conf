# Root in the container is the unprivileged owner of the rootless daemon, and
# the only user able to write the dashboard's data directory.
user root;
worker_processes auto;

events { }

http {
  # The image's mime.types is hidden by the mount over /etc/nginx.
  types {
    text/html html;
    text/css css;
    text/javascript js;
    application/json json;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/x-icon ico;
    font/woff2 woff2;
  }
  default_type application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # Anything not addressed by one of the names below, which includes
  # Tailscale Serve: the dashboard, with every app under a path of its own.
  server {
    listen 80 default_server;
    absolute_redirect off;
    charset utf-8;

    location / {
      root /srv/dashboard;
    }

    # The dashboard saves its layout by writing this file back.
    location = /data/apps.json {
      root /srv/dashboard;
      dav_methods PUT;
      dav_access user:rw group:r all:r;
      client_max_body_size 64k;
      add_header Cache-Control no-store;
    }

    location = /draw { return 301 /draw/; }
    location /draw/ {
      alias /srv/draw/;
    }

    location = /write { return 301 /write/; }
    location /write/ {
      alias /srv/write/;
    }

    # The apps are served from their working trees.
    location ~ /\. {
      return 404;
    }

    # The monorepo, for the editor at /write to open and save Markdown in place.
    # Folders are listed, and nothing but Markdown is read or written.
    location /files/ {
      alias /srv/files/;
      # Listed even where there is an index.html, which would be served instead.
      index no-index;
      autoindex on;
      autoindex_format json;
      add_header Cache-Control no-store;
    }
    location ~ ^/files/(.+\.(?:md|markdown|txt))$ {
      alias /srv/files/$1;
      dav_methods PUT;
      dav_access user:rw group:r all:r;
      client_max_body_size 32m;
      add_header Cache-Control no-store;
    }
    location ~ ^/files/.*[^/]$ {
      return 404;
    }

    location = /notebook { return 301 /notebook/; }
    location /notebook/ {
      proxy_pass http://notebook:8090/;
      include includes/proxy_defaults.conf;
      # Claude's progress is streamed, and a script takes minutes to write.
      proxy_buffering off;
      proxy_read_timeout 30m;
      # Episodes are published as WAV, about 3 MB a minute.
      client_max_body_size 1g;
    }

    # The path is fixed by audiobookshelf, whose client is built for it.
    location /audiobookshelf {
      proxy_pass http://audiobookshelf;
      include includes/proxy_defaults.conf;
    }

    # Must match the Base URL in jellyfin's networking settings.
    location /video {
      proxy_pass http://jellyfin:8096;
      include includes/proxy_defaults.conf;
    }

    # Must match webserver.paths.prefix, which pihole expects to be stripped.
    location = /pihole { return 301 /pihole/admin/; }
    location /pihole/ {
      proxy_pass http://pihole/;
      include includes/proxy_defaults.conf;
    }
  }

  server {
    listen 80;
    server_name cache.pacman.home;

    location / {
      proxy_pass http://pacoloco:9129;
      include includes/proxy_defaults.conf;
    }
  }

  server {
    listen 80;
    server_name shelf.home;

    location / {
      proxy_pass http://audiobookshelf;
      include includes/proxy_defaults.conf;
    }
  }

  server {
    listen 80;
    server_name video.home;

    location / {
      proxy_pass http://jellyfin:8096;
      include includes/proxy_defaults.conf;
    }
  }
}
