name: onyx

services:
  api_server:
    image: onyxdotapp/onyx-backend:latest
    command: >
      /bin/sh -c "alembic upgrade head &&
      uvicorn onyx.main:app --host 0.0.0.0 --port 8080"
    depends_on:
      relational_db:
        condition: service_started
    restart: unless-stopped
    env_file:
    - path: .env
      required: false
    environment:
    - AUTH_TYPE=${AUTH_TYPE:-basic}
    - POSTGRES_HOST=relational_db
    - CODE_INTERPRETER_BASE_URL=http://code-interpreter:8000
    - DISABLE_VECTOR_DB=true
    - FILE_STORE_BACKEND=postgres
    - CACHE_BACKEND=postgres
    - AUTH_BACKEND=postgres
    extra_hosts:
    - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 25s

  web_server:
    image: onyxdotapp/onyx-web-server:latest
    depends_on:
      - api_server
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_URL=http://api_server:8080
      - OVERRIDE_API_PRODUCTION=true

  relational_db:
    image: postgres:15.2-alpine
    env_file:
    - path: .env
      required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
    - db_volume:/var/lib/postgresql/data

  # This container name cannot have an underscore in it due to Vespa expectations of the URL
  code-interpreter:
    image: onyxdotapp/code-interpreter:latest
    command: ["bash", "./entrypoint.sh", "code-interpreter-api"]
    restart: unless-stopped
    volumes:
    - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock

  cli_server:
    image: onyxdotapp/onyx-cli:latest
    command: ["serve", "--host", "0.0.0.0", "--port", "2222", "--api-server-url", "http://api_server:8080"]
    depends_on:
    - api_server
    restart: unless-stopped
    ports:
    - "${ONYX_SSH_PORT:-2222}:2222"
    volumes:
    - cli_config:/home/onyx/.config

volumes:
  # Necessary for persisting data for use
  db_volume:
  cli_config:
