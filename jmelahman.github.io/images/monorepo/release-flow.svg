<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="t">
  <title id="t">Releasing from the monorepo: git orchard release tags the subtree, mirror.yml publishes the tag upstream, and the mirror's release workflow publishes artifacts</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8878"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, Helvetica, Arial, sans-serif; fill: #2c2c2c; font-size: 12px; }
    .m, .m text { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 10.5px; }
    .mu { fill: #8a8878; }
    .inv { fill: #fbfaef; }
    .ac { fill: #8c0000; }
    .lane { fill: #efeee0; }
    .lanel { font-size: 10.5px; letter-spacing: .08em; fill: #8a8878; font-weight: 700; }
    .step { fill: #fbfaef; stroke: #d9d6c3; stroke-width: 1.5; }
    .hot { fill: #8c0000; }
    .num { font-size: 11px; font-weight: 700; fill: #8c0000; }
    .num.inv { fill: #fbfaef; }
    .wire { stroke: #8a8878; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Lanes -->
  <rect class="lane" x="20" y="20" width="680" height="110" rx="8"/>
  <text class="lanel" x="36" y="80" transform="rotate(-90 36 80)" text-anchor="middle">MONOREPO</text>
  <rect class="lane" x="20" y="150" width="680" height="110" rx="8"/>
  <text class="lanel" x="36" y="205" transform="rotate(-90 36 205)" text-anchor="middle">MIRROR</text>

  <!-- 1 -->
  <rect class="step" x="58" y="38" width="190" height="74" rx="6"/>
  <text class="num" x="70" y="58">1 · you run</text>
  <text class="m" x="70" y="78">git orchard release</text>
  <text class="m" x="70" y="94" xml:space="preserve">  agentic-kanban</text>

  <!-- 2 -->
  <rect class="step" x="274" y="38" width="190" height="74" rx="6"/>
  <text class="num" x="286" y="58">2 · tag pushed</text>
  <text class="m ac" x="286" y="80" font-weight="700">agentic-kanban/v1.2.4</text>
  <text class="mu" x="286" y="98" font-size="10">once upstream has the commit</text>

  <!-- 3 -->
  <rect class="hot" x="490" y="38" width="196" height="74" rx="6"/>
  <text class="num inv" x="502" y="58">3 · mirror.yml</text>
  <text class="m inv" x="502" y="78">matches **/v*</text>
  <text class="inv" x="502" y="96" font-size="10">publishes the tag upstream</text>

  <!-- 4 -->
  <rect class="step" x="490" y="168" width="196" height="74" rx="6"/>
  <text class="num" x="502" y="188">4 · upstream tag</text>
  <text class="m ac" x="502" y="210" font-weight="700">v1.2.4</text>
  <text class="mu" x="502" y="228" font-size="10">jmelahman/agentic-kanban</text>

  <!-- 5 -->
  <rect class="step" x="274" y="168" width="190" height="74" rx="6"/>
  <text class="num" x="286" y="188">5 · release.yml</text>
  <text class="m" x="286" y="208">shared/goreleaser</text>
  <text class="mu" x="286" y="226" font-size="10">same file in every mirror</text>

  <!-- 6 -->
  <rect class="step" x="58" y="168" width="190" height="74" rx="6"/>
  <text class="num" x="70" y="188">6 · published</text>
  <text x="70" y="208" font-size="11">GitHub release · PyPI</text>
  <text class="m" x="70" y="226">go install …@v1.2.4</text>

  <!-- Arrows -->
  <path class="wire" d="M248,75 L272,75" marker-end="url(#arrow)"/>
  <path class="wire" d="M464,75 L488,75" marker-end="url(#arrow)"/>
  <path class="wire" d="M588,112 L588,166" marker-end="url(#arrow)"/>
  <path class="wire" d="M490,205 L466,205" marker-end="url(#arrow)"/>
  <path class="wire" d="M274,205 L250,205" marker-end="url(#arrow)"/>
</svg>
