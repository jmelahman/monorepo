[build-system]
requires = ["hatchling", "hatch-vcs", "go-bin~=1.26.3", "manygo"]
build-backend = "hatchling.build"

[project]
name = "local-preview"
description = "Local-first preview-deployment orchestrator: a preview per commit"
license = {file = "LICENSE"}
authors = [{ name = "Jamison Lahman", email = "jamison@lahman.dev" }]
readme = "README.md"
requires-python = ">=3.6"
keywords = ["preview", "deployments", "orchestrator", "go", "react", "sqlite"]
classifiers = [
    "Programming Language :: Go",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dynamic = ["version"]


[project.urls]
Repository = "https://github.com/jmelahman/local-preview"

[tool.hatch.build]
include = [
    "go.mod",
    "go.sum",
    "**/*.go",
    "internal/db/schema.sql",
    "web/package.json",
    "web/package-lock.json",
    "web/index.html",
    "web/tsconfig.json",
    "web/vite.config.ts",
    "web/public/**",
    "web/src/**",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.custom]
binary_name = "preview"
