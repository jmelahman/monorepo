hide_status: [passed, skipped]

repos:
  # BEGIN orchard:base
  # Shared by every subtree: .config/git-orchard/shared/base in the monorepo
  # (https://github.com/jmelahman/monorepo). Edit it there; `git orchard sync`
  # copies it here.
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86  # frozen: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
  # END orchard:base

  # BEGIN orchard:python
  # Python. ruff reads only the source, so it runs from its own hook. ty and
  # pytest need the project's packages, so they run from uv.lock with
  # --locked: a stale lockfile fails the hook instead of being re-resolved.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 18b2b8bb1b9b90d2d21283756e89b07fc9c747bf  # frozen: v0.0.95
    hooks:
      - id: ty
        args: [--locked]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --locked --quiet pytest
        language: python
        additional_dependencies: [uv==0.13.6]
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
  # END orchard:python
