<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0c">
  <title>Music</title>
  <link rel="stylesheet" href="design/design.css">
  <link rel="stylesheet" href="design/toolbar.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- So the tailnet's "install app" works over Tailscale Serve's HTTPS. -->
  <link rel="manifest" href="manifest.webmanifest">
  <script src="design/theme.js"></script>
</head>
<body>
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <!-- The icons, drawn once and used by name. -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM9.5 12 19 5.5v13z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM14.5 12 5 18.5v-13z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11V9.5A3.5 3.5 0 0 1 7.5 6H20M7 21l-3-3 3-3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11V9.5A3.5 3.5 0 0 1 7.5 6H20M7 21l-3-3 3-3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 10.5l1.5-1v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM15.5 15.5 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m15.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-saved" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zm-1.2 12.3-3.6-3.6 1.3-1.3 2.3 2.3 4.9-4.9 1.3 1.3z"/></symbol>
    <symbol id="i-mix" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 6.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z" fill-rule="evenodd"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 5.5a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zm0 5a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zm0 5a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h12M4 11h12M4 16h7M18 9v8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="17.5" r="2.2"/></symbol>
    <symbol id="i-smart" viewBox="0 0 24 24"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9zM18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l10-2v13M9 18a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zm10-2a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  </svg>

  <header class="toolbar">
    <a class="brand" href="#/"><h1>Music</h1></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-tab="home">Home</a>
      <a href="#/library" data-tab="library">Library</a>
    </nav>
    <form id="search" class="search" role="search">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search-q" type="search" placeholder="Search songs to stream" aria-label="Search songs to stream" autocomplete="off">
    </form>
    <div class="group end">
      <span id="status" class="status" role="status" title="The server"></span>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <aside id="up-next" class="up-next" aria-label="Up next" hidden></aside>

  <footer id="player-bar" class="player-bar" hidden>
    <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <div class="middle">
      <div class="np">
        <div id="np-art" class="art"></div>
        <div class="np-text">
          <span id="np-title" class="np-title"></span>
          <span id="np-sub" class="np-sub"></span>
        </div>
      </div>
      <div class="controls">
        <button type="button" id="shuffle" class="icon-btn toggle" aria-label="Shuffle" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
        <button type="button" id="prev" class="icon-btn" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
        <button type="button" id="playpause" class="icon-btn chrome" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
        <button type="button" id="next" class="icon-btn" aria-label="Next"><svg><use href="#i-next"/></svg></button>
        <button type="button" id="repeat" class="icon-btn toggle" aria-label="Repeat" aria-pressed="false"><svg><use href="#i-repeat"/></svg></button>
        <span id="time" class="time">0:00 / 0:00</span>
      </div>
    </div>
    <div class="aux">
      <button type="button" id="queue" class="icon-btn" aria-label="Up next" title="Up next" aria-controls="up-next" aria-expanded="false"><svg><use href="#i-list"/></svg></button>
      <button type="button" id="mute" class="icon-btn" aria-label="Mute"><svg><use href="#i-volume"/></svg></button>
      <input id="volume" class="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
    </div>
  </footer>

  <audio id="player" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
