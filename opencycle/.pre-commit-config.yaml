hide_status: [passed, skipped]

repos:
  # BEGIN orchard:base
  # Shared by every subtree: .config/git-orchard/shared/base in the monorepo
  # (https://github.com/jmelahman/monorepo). Edit it there; `git orchard sync`
  # copies it here.
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86  # frozen: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
  # END orchard:base

  # BEGIN orchard:shell
  # Shared by subtrees with shell scripts: .config/git-orchard/shared/shell in
  # the monorepo.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=style]

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt -w -s
        language: golang
        # shfmt's go.mod needs Go 1.26, and a local hook gets no version
        # inferred, so without this prek builds it with CI's older Go.
        language_version: ">=1.26"
        additional_dependencies:
          - mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
        types: [shell]
  # END orchard:shell

  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: b7a4935fc6483d51837f7080598dad456f4f7645 # frozen: 4.5.0
    hooks:
      - id: gdlint
      - id: gdformat

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # These need Godot and the addons, which scripts/setup.sh installs. They are
  # on the manual stage so a run without Godot, like the monorepo's CI, passes
  # them by: `prek run --all-files --stage manual` runs them. They run one at
  # a time: each opens the project, and two Godots importing into one .godot/
  # at once is how an import cache gets corrupted.
  - repo: local
    hooks:
      - id: godot-check
        name: godot check (compile, warnings are errors)
        entry: scripts/check.sh
        language: system
        files: \.(gd|tscn|tres)$|^project\.godot$
        pass_filenames: false
        stages: [manual]
      - id: godot-resave
        name: scenes are as the editor would write them
        entry: scripts/resave.sh --check
        language: system
        files: \.(tscn|tres)$|^project\.godot$
        pass_filenames: false
        stages: [manual]
      - id: godot-test
        name: gdUnit4
        entry: scripts/test.sh
        language: system
        files: \.(gd|tscn|tres|po)$|^project\.godot$
        pass_filenames: false
        stages: [manual]
