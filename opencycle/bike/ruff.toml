# build_bike.py runs inside Blender's own Python (bpy, its bundled numpy), so
# this is ruff alone rather than the monorepo's python profile, like veloverse.
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Single-letter maths names (I, J, O) read like the formulas they implement.
ignore = ["E741"]
