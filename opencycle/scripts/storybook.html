<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCycle Storybook</title>
<style>
  :root { color-scheme: dark; --bg: #101214; --panel: #191c1f; --text: #e4e6e8; --dim: #8f969c; --line: #2b3035; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0; font-size: 22px; }
  .status { color: var(--dim); margin: 2px 0 28px; }
  section { border-top: 1px solid var(--line); padding: 18px 0 26px; }
  h2 { margin: 0; font-size: 18px; }
  .meta { color: var(--dim); font-size: 13px; }
  .note { margin: 6px 0 12px; max-width: 80ch; white-space: pre-wrap; }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 10px; }
  figure { margin: 0; background: var(--panel); }
  figure img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; cursor: zoom-in; }
  figcaption { padding: 5px 9px; color: var(--dim); font-size: 13px; }
  #view { position: fixed; inset: 0; display: none; flex-direction: column; background: #000; z-index: 1; }
  #view.open { display: flex; }
  #view img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); }
  #bar span { flex: 1 1 200px; font-size: 13px; }
  button { background: #2b3035; color: var(--text); border: 0; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>OpenCycle Storybook</h1>
  <p class="status" id="status">Loading…</p>
  <div id="chapters"></div>
</main>
<div id="view">
  <img id="picture" alt="">
  <div id="bar">
    <span id="caption"></span>
    <span class="meta">←→ shots · ↑↓ chapters</span>
    <button id="compare">Hold to see previous chapter (space)</button>
    <button id="close">Close (esc)</button>
  </div>
</div>
<script>
  const list = document.getElementById("chapters");
  const view = document.getElementById("view");
  const picture = document.getElementById("picture");
  const caption = document.getElementById("caption");
  const compare = document.getElementById("compare");
  let chapters = [];
  let seen = "";
  let open = null;

  const path = (chapter, shot) => `${encodeURIComponent(chapter.dir)}/${encodeURIComponent(shot.file)}`;

  function element(tag, className, text) {
    const made = document.createElement(tag);
    if (className) made.className = className;
    if (text) made.textContent = text;
    return made;
  }

  function draw() {
    list.replaceChildren();
    chapters.forEach((chapter, index) => {
      const section = element("section");
      section.append(element("h2", "", chapter.title));
      section.append(element("div", "meta", `${chapter.when} · ${chapter.commit}`));
      section.append(element("p", "note", chapter.note));
      const shots = element("div", "shots");
      chapter.shots.forEach((shot, at) => {
        const figure = element("figure");
        const image = element("img");
        image.loading = "lazy";
        image.src = path(chapter, shot);
        image.alt = `${chapter.title}: ${shot.label}`;
        image.onclick = () => show(index, at);
        figure.append(image, element("figcaption", "", shot.label));
        shots.append(figure);
      });
      section.append(shots);
      list.append(section);
    });
  }

  // The same position in the next older chapter, if it has one.
  function previous() {
    const older = chapters[open.index + 1];
    return older && older.shots[open.at] ? older : null;
  }

  const describe = (chapter, at) => `${chapter.title}: ${chapter.shots[at].label} (${at + 1}/${chapter.shots.length})`;

  function show(index, at) {
    open = { index, at };
    const chapter = chapters[index];
    picture.src = path(chapter, chapter.shots[at]);
    caption.textContent = describe(chapter, at);
    compare.disabled = !previous();
    view.classList.add("open");
  }

  // Left and right walk the shots of a chapter, wrapping around.
  function turn(by) {
    const count = chapters[open.index].shots.length;
    show(open.index, (open.at + by + count) % count);
  }

  // Up and down walk the chapters as they're laid out on the page, newest at the top. Older
  // chapters can have fewer shots, so this lands on the last one if the same one isn't there.
  function leaf(by) {
    const chapter = chapters[open.index + by];
    if (chapter) show(open.index + by, Math.min(open.at, chapter.shots.length - 1));
  }

  function flip(back) {
    const older = open && previous();
    if (!older) return;
    const chapter = back ? older : chapters[open.index];
    picture.src = path(chapter, chapter.shots[open.at]);
    caption.textContent = describe(chapter, open.at);
  }

  function close() {
    view.classList.remove("open");
    open = null;
  }

  compare.onpointerdown = () => flip(true);
  compare.onpointerup = compare.onpointerleave = () => flip(false);
  document.getElementById("close").onclick = close;
  addEventListener("keydown", (event) => {
    if (!open) return;
    if (event.key === "Escape") close();
    if (event.key === " ") { event.preventDefault(); if (!event.repeat) flip(true); }
    const move = {
      ArrowLeft: () => turn(-1),
      ArrowRight: () => turn(1),
      ArrowUp: () => leaf(-1),
      ArrowDown: () => leaf(1),
    }[event.key];
    if (move) { event.preventDefault(); move(); }
  });
  addEventListener("keyup", (event) => {
    if (event.key === " ") flip(false);
  });

  async function refresh() {
    const status = document.getElementById("status");
    try {
      const response = await fetch("chapters.json", { cache: "no-store" });
      if (response.status === 404) {
        status.textContent = "No chapters yet.";
        return;
      }
      const text = await response.text();
      status.textContent = `Checked ${new Date().toLocaleTimeString()}. Refreshes by itself.`;
      if (text !== seen) {
        seen = text;
        const shifted = open !== null;
        chapters = JSON.parse(text).reverse();
        if (shifted) close();
        draw();
      }
    } catch {
      status.textContent = "Can't reach the server.";
    }
  }

  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
