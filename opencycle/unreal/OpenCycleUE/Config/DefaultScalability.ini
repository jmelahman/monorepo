; The ride's own turns on the engine's presets (BaseScalability.ini).
;
; Foliage quality thins the scatter underfoot (ARideGameMode::ThinScatterWithQuality): grass,
; ferns, litter and small props. The engine's Low drops it all, which leaves the jungle floor and the
; paddy banks bare earth, so Low keeps a third of it.
[FoliageQuality@0]
foliage.DensityScale=0.3
grass.DensityScale=0.3

[FoliageQuality@1]
foliage.DensityScale=0.5
grass.DensityScale=0.5

; The engine's Low turns the sun's shadows off, and the countryside goes flat: the cuts, the woods
; and the rail lose all their shape. Low keeps them, coarse: virtual shadow pages at half the
; resolution (a bias of 1).
[ShadowQuality@0]
r.ShadowQuality=1
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxCSMResolution=1024
r.Shadow.Virtual.MaxPhysicalPages=1024
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=1.0

; The engine's Low drops Lumen and distance-field AO both, which leaves the sky light lighting
; everything unoccluded: the woods wash out blue, a dark bank under the maples reads as snow and
; the wet road's puddles mirror a white sky. Low keeps DFAO, which shadows the sky light (and its
; reflections) for a fraction of Lumen's cost, and screen-space AO in the corners.
[GlobalIlluminationQuality@0]
r.DistanceFieldAO=1
r.AOQuality=1
r.SkylightIntensityMultiplier=1.0

[PostProcessQuality@0]
r.AmbientOcclusionLevels=1
r.AmbientOcclusionMaxQuality=50

; Low's puddles need something to mirror besides the sky: screen-space reflections at their lowest.
[ReflectionQuality@0]
r.SSR.Quality=1
