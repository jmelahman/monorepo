name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

jobs:
  # The tests themselves, with the coverage floor, run from the coverage hook in
  # .pre-commit-config.yaml, which replays the checked-in seed corpora
  # (testdata/fuzz/). This job additionally explores new inputs for a short,
  # bounded time.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Fuzz smoke
        run: |
          for pkg in ./internal/pkgbuild ./internal/pkgfile ./internal/alpmdb ./internal/rules ./site; do
            for target in $(go test "$pkg" -list '^Fuzz' | grep '^Fuzz'); do
              go test "$pkg" -fuzz "^${target}\$" -fuzztime 15s
            done
          done
