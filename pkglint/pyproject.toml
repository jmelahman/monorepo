# The packages needed to *import* the build hook, pinned exactly. The Go
# toolchain pin lives in hatch_build.py and is declared dynamically via the
# hook's dependencies().
[build-system]
requires = ["hatchling==1.32.0", "hatch-vcs==0.5.0", "manygo==0.2.0"]
build-backend = "hatchling.build"

[project]
name = "pkglint"
description = "Security-focused linter for Arch Linux PKGBUILDs"
license = {file = "LICENSE"}
authors = [{ name = "Jamison Lahman", email = "jamison@lahman.dev" }]
readme = "README.md"
requires-python = ">=3.6"
keywords = [
  "archlinux", "aur", "pkgbuild", "linter", "security", "supply-chain", "tooling", "tools",
]
classifiers = [
    "Programming Language :: Go",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jmelahman/pkglint"

# Go sources belong in the sdist only; the wheel carries just the built
# binary (as a script), so nothing from the tree is selected there.
[tool.hatch.build.targets.sdist]
include = [
    "go.mod",
    "go.sum",
    "**/*.go",
    "site/templates/*.html",
    "build-constraints.txt",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.custom]
binary_name = "pkglint"
