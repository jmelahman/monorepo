name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  github-release:
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      # There is no checkout in this job, so tell gh which repository to use.
      # A hook repository has nothing to attach, only the notes.
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
