# All hooks use `language: golang` so the framework provisions the Go
# toolchain itself — a system `go` is used when present, downloaded otherwise.
# Downloading requires pre-commit >= 3.0.0; prek supports it out of the box.

# Fixers — rewrite files and fail the run when they do.

- id: gofmt
  name: gofmt
  description: Rewrite Go sources with `gofmt -l -w`; fails when a file changes.
  entry: gofmt -l -w
  language: golang
  types: [go]
  minimum_pre_commit_version: 3.0.0

- id: go-fix
  name: go fix
  description: Apply `go fix` suggested fixes; fails when a file changes.
  entry: go fix
  args: [./...]
  language: golang
  types: [go]
  pass_filenames: false
  minimum_pre_commit_version: 3.0.0

- id: go-mod-tidy
  name: go mod tidy
  description: Make go.mod and go.sum match the source code; fails when they change.
  entry: go mod tidy
  language: golang
  types_or: [go, go-mod, go-sum]
  pass_filenames: false
  minimum_pre_commit_version: 3.0.0

- id: go-work-sync
  name: go work sync
  description: Sync the workspace build list back into each module's go.mod; fails when one changes.
  entry: go work sync
  language: golang
  # There is no `go-work` file type to match on.
  files: (^|/)go\.(work|mod|sum)$
  pass_filenames: false
  minimum_pre_commit_version: 3.0.0

# Checks — read-only.

- id: go-vet
  name: go vet
  description: Report likely mistakes with `go vet`.
  entry: go vet
  args: [./...]
  language: golang
  types_or: [go, go-mod, go-sum]
  pass_filenames: false
  minimum_pre_commit_version: 3.0.0

- id: go-test
  name: go test
  description: Run `go test`.
  entry: go test
  args: [./...]
  language: golang
  types_or: [go, go-mod, go-sum]
  pass_filenames: false
  minimum_pre_commit_version: 3.0.0

# Updaters — manual stage only, so they never fire on a commit. Run on demand:
#   prek run --all-files --stage manual go-get

- id: go-get
  name: go get -u
  description: Upgrade dependencies with `go get -u ./...`; fails when go.mod or go.sum change.
  entry: go get
  args: [-u, ./...]
  language: golang
  always_run: true
  pass_filenames: false
  stages: [manual]
  minimum_pre_commit_version: 3.0.0
