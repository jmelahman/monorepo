[project]
name = "monorepo"
version = "0.0.0"
authors = [
  {name="Jamison Lahman", email="jamison@lahman.dev"}
]
requires-python = ">=3.13"

[dependency-groups]
dev = [
    # Imported by scripts that ty checks: skills/, templates/.
    "beautifulsoup4>=4.13.0",
    "hatchling>=1.27.0",
    # The hatch_build.py hooks import it to tag Go wheels.
    "manygo",
    "pytest>=8.4.0",
    "pyyaml>=6.0.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed in {name}
    "COM812", # Trailing comma missing
    "CPY001", # Missing copyright notice at top of file
    "D",      # pydocstyle
    "EM101",  # Exception must not use a string literal
    "EM102",  # Exception must not use an f-string literal
    "ERA001", # Found commented-out code
    "FIX001", # Line contains FIXME, consider resolving the issue
    "FIX002", # Line contains TODO, consider resolving the issue
    "FIX004", # Line contains HACK, consider resolving the issue
    "INP001", # File {filename} is part of an implicit namespace package. Add an __init__.py.
    "PTH",    # flake8-use-pathlib
    "S101",   # Use of assert detected
    "S607",   # Starting a process with a partial executable path
    "T201",   # `print` found
    "TD",     # flake8-todos
    "TRY003", # Avoid specifying long messages outside the exception class
]
select = ["ALL"]

[tool.ruff.lint.isort]
# Google config: https://pycqa.github.io/isort/docs/configuration/profiles.html#google
force-single-line=true
force-sort-within-sections=true
order-by-type=false
single-line-exclusions = ["typing", "collections.abc"]
required-imports = ["from __future__ import annotations"]

[tool.ty.analysis]
# validate_configs.py falls back to tomli only on Pythons without tomllib.
allowed-unresolved-imports = ["tomli"]

[tool.pytest.ini_options]
pythonpath = [
  "manygo",
]

[tool.uv.sources]
# A path source rather than a workspace member: manygo/ keeps its own uv.lock,
# which is what its mirror runs from, while the root still type-checks against
# the local copy.
manygo = { path = "manygo", editable = true }
