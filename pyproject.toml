[project]
name = "monorepo"
version = "0.0.0"
requires-python = ">=3.13"
authors = [{ name = "Jamison Lahman", email = "jamison@lahman.dev" }]

[dependency-groups]
dev = [
  "agentic-kanban>=1.8.2",
  # Imported by scripts that ty checks: skills/, templates/.
  "beautifulsoup4>=4.13.0",
  "git-orchard>=1.3.0",
  "hatchling>=1.27.0",
  # The hatch_build.py hooks import it to tag Go wheels.
  "local-preview>=0.31.5",
  "manygo",
  "pinsync>=0.1.0",
  "prek>=0.5.7",
  "pytest>=8.4.0",
  "pyyaml>=6.0.2",
  "ty>=0.0.95",
  "undot>=0.3.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "manygo",
]

[tool.ty.src]
# opencycle's scripts run inside the Unreal editor, against its generated `unreal` module,
# which isn't on PyPI and which tools/containers/unreal shadows here as a namespace package.
exclude = ["opencycle/scripts"]

[tool.uv.sources]
# A path source rather than a workspace member: manygo/ keeps its own uv.lock,
# which is what its mirror runs from, while the root still type-checks against
# the local copy.
manygo = { path = "manygo", editable = true }
agentic-security-review = { path = "github-actions/agentic-security-review", editable = true }
