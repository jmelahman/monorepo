# Only the packages needed to *import* the build hook live here, pinned
# exactly. The toolchain pins (go-bin, ziglang, solod) are centralized in
# hatch_build.py and declared dynamically via the hook's dependencies().
[build-system]
requires = ["hatchling==1.32.0", "hatch-vcs==0.5.0", "manygo==0.2.0"]
build-backend = "hatchling.build"

[project]
name = "check-symlinks"
description = "Check for broken symlinks"
license = {file = "LICENSE"}
authors = [{ name = "Jamison Lahman", email = "jamison@lahman.dev" }]
readme = "README.md"
requires-python = ">=3.6"
keywords = [
  "ci", "continuous-integration", "linter", "symlinks", "tooling", "tools",
]
classifiers = [
    "Programming Language :: Go",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
]
dynamic = ["version"]


[project.urls]
Repository = "https://github.com/jmelahman/check-symlinks"

# Go/solod sources belong in the sdist only; the wheel carries just the
# built binary (as a script), so nothing from the tree is selected there.
[tool.hatch.build.targets.sdist]
include = [
    "go.mod",
    "**/*.go",
    "so/go.mod",
    "so/go.sum",
    "so/gotest.mod",
    "gocompat/go.mod",
    "scripts/zigcc",
    "build-constraints.txt",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.custom]
binary_name = "check-symlinks"
