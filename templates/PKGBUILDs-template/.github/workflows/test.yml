name: Tests

on:
  push:
    branches:
      - "master"
      - "pkgreleaser/*"
  pull_request:

permissions: {}

jobs:
  presubmit:
    name: Lint and build changed packages
    runs-on: ubuntu-latest
    if: ${{ github.ref_name != 'master' }}
    container: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6 # 2026-09-05
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run prek
        uses: $/.github/actions/prek
        with:
          base: origin/master

  postsubmit:
    name: Lint and build merged packages
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'master' }}
    container: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6 # 2026-09-05
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run prek
        uses: $/.github/actions/prek
        with:
          base: origin/master~1
