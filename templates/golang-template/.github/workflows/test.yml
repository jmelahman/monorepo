name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

env:
  GO_VERSION: stable

jobs:
  # Everything that builds or runs code. Linting lives in the pre-commit job
  # below, which runs the same hooks contributors do — no second set of tool
  # versions to keep in sync.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          # go.mod is listed too so the cache key resolves in a repo with no
          # third-party dependencies (and therefore no go.sum).
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: go mod tidy is a no-op
        run: |
          scripts/modules.sh go mod tidy
          git diff --exit-code

      - run: scripts/modules.sh go build ./...

      - run: scripts/modules.sh go test -race ./...

      # Pinned alongside the govulncheck hook in .pre-commit-config.yaml;
      # bump both together.
      - name: govulncheck
        run: scripts/modules.sh go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # gofmt, go vet, golangci-lint, aligo, actionlint and zizmor, at the
  # versions pinned in .pre-commit-config.yaml. On a pull request only the
  # changed files are considered; on master, everything.
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read # For the zizmor hook's online audits.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece
        env:
          # Lets the zizmor hook run its online audits instead of falling
          # back to offline mode.
          GH_TOKEN: ${{ github.token }}
        with:
          prek-version: '0.5.3'
          extra-args: ${{ github.event_name == 'pull_request' && format('--from-ref {0} --to-ref {1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all-files' }}
