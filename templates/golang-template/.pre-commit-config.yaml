# Hooks for prek (https://prek.j178.dev) — `prek install` once, then
# `prek run --all-files` to check everything.
#
# Everything here is provisioned by the hook framework: the Go hooks use
# `language: golang`, so a suitable system Go is used when present and a
# toolchain is downloaded otherwise. Nothing needs to be installed first.
#
# Running under pre-commit instead of prek? Replace the `builtin` repo below
# with https://github.com/pre-commit/pre-commit-hooks (the ids are the same)
# and require pre-commit >= 3.0.0.
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Toolchain-provided Go tools: gofmt, go fix, go mod tidy, go vet, go test,
  # and go get -u.
  - repo: https://github.com/jmelahman/go-pre-commit-hooks
    rev: v1.1.0
    hooks:
      - id: gofmt
        args: [-s] # Appended to `gofmt -l -w`: also simplify.
      - id: go-fix
      - id: go-mod-tidy
      - id: go-vet
      # Too slow for every commit, so it runs on push with the same flags CI
      # uses. Multi-module repos: swap the entry for
      # `scripts/modules.sh go test -race ./...` (see README).
      - id: go-test
        args: [-race, ./...]
        stages: [pre-push]
      # Manual only: `prek run --all-files --stage manual go-get` upgrades
      # every dependency.
      - id: go-get

  # Third-party Go tools. `language: golang` + `additional_dependencies` means
  # the framework `go install`s them into the hook environment — still no
  # system dependency. Bump the pinned versions deliberately; Dependabot does
  # not see them.
  - repo: local
    hooks:
      - id: golangci-lint-config-verify
        name: golangci-lint config verify
        entry: golangci-lint config verify
        language: golang
        additional_dependencies:
          - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
        files: ^\.golangci\.(yml|yaml|toml|json)$
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: scripts/modules.sh golangci-lint run --fix
        language: golang
        additional_dependencies:
          - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
        types_or: [go, go-mod, go-sum]
        pass_filenames: false
        # golangci-lint parallelizes internally and caches per module; running
        # copies of it side by side just thrashes the cache.
        require_serial: true

      - id: aligo
        name: aligo
        description: Report structs whose field order wastes memory.
        entry: scripts/modules.sh aligo check ./...
        language: golang
        additional_dependencies:
          - github.com/essentialkaos/aligo/v2@v2.5.3
        types_or: [go, go-mod, go-sum]
        pass_filenames: false
        require_serial: true

      - id: govulncheck
        name: govulncheck
        description: Report known vulnerabilities reachable from this code.
        entry: scripts/modules.sh govulncheck ./...
        language: golang
        additional_dependencies:
          - golang.org/x/vuln/cmd/govulncheck@v1.8.0
        files: ^(.*/)?go\.(mod|sum)$
        pass_filenames: false
        require_serial: true
        # Queries the vulnerability database over the network, so it waits
        # for push rather than firing on every commit.
        stages: [pre-push]

  # Workflow linting: actionlint for syntax and expression errors, zizmor for
  # the security audit (unpinned actions, script injection through ${{ }},
  # over-broad permissions, credential persistence).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Upstream's own hook repo: the rev is a git SHA, and the zizmor version it
  # installs is whatever that release pins. `prek auto-update` bumps it.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      # Without a GitHub token zizmor runs in offline mode and skips the
      # audits that query the API — fine locally, and CI's prek job passes
      # GITHUB_TOKEN via `env:` to get the full set.
      - id: zizmor
