default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

# In workspace mode this root project sees every file in the tree, subtrees
# included, and each subtree's own .pre-commit-config.yaml runs from its
# directory. Put file-scoped hooks (formatters, linters that take a file list)
# here, and module-scoped ones (tests, vet, anything that needs a project
# root) in the subtree's config, or in a profile under .config/git-orchard.
repos:
  # BEGIN orchard:base
  # Shared by every subtree: .config/git-orchard/shared/base in the monorepo
  # (https://github.com/jmelahman/monorepo). Edit it there; `git orchard sync`
  # copies it here.
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86  # frozen: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
  # END orchard:base

  # Copies the profiles in .config/git-orchard/shared into the subtrees that
  # list them in .config/git-orchard/subtrees. It exits 1 when it changes a
  # file, so a subtree that drifts from its profiles fails CI.
  - repo: https://github.com/jmelahman/git-orchard
    rev: 50de16612d3ebcd745b8feb5bb4d3637b732140d # frozen: v1.1.0
    hooks:
      - id: git-orchard-sync
