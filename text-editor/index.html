<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Markdown Editor</title>
  <link rel="stylesheet" href="vendor/toastui-editor/toastui-editor.min.css">
  <link rel="stylesheet" href="vendor/toastui-editor/toastui-editor-dark.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="theme.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="group">
      <button type="button" id="file-button" popovertarget="file-menu" aria-haspopup="menu">File</button>
      <div id="file-menu" class="menu" role="menu" aria-labelledby="file-button" popover>
        <button type="button" role="menuitem" id="new">New</button>
        <button type="button" role="menuitem" id="open">Open… <kbd>Ctrl+O</kbd></button>
        <button type="button" role="menuitem" id="recent-button" popovertarget="recent-menu" aria-haspopup="menu" hidden>Open recent <span aria-hidden="true">›</span></button>
        <div id="recent-menu" class="menu" role="menu" aria-labelledby="recent-button" popover></div>
        <hr>
        <button type="button" role="menuitem" id="save">Save <kbd>Ctrl+S</kbd></button>
        <button type="button" role="menuitem" id="save-as">Save as… <kbd>Ctrl+Shift+S</kbd></button>
        <button type="button" role="menuitem" id="revisions-button" popovertarget="revisions-menu" aria-haspopup="menu" hidden>Revisions <span aria-hidden="true">›</span></button>
        <div id="revisions-menu" class="menu" role="menu" aria-labelledby="revisions-button" popover></div>
        <hr>
        <button type="button" role="menuitem" id="export">Export as HTML</button>
        <button type="button" role="menuitem" id="copy">Copy as rich text</button>
      </div>
      <input type="file" id="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
    </div>

    <div class="group" id="insert" role="group" aria-label="Insert">
      <button type="button" class="icon" data-format="table" title="Table: right-click a cell to add or remove rows and columns" aria-label="Table">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 10h16M4 14.5h16M10 5v14"/></svg>
      </button>
      <button type="button" class="icon" data-format="codeBlock" title="Code block" aria-label="Code block">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM10 9.5L7.5 12l2.5 2.5M14 9.5l2.5 2.5-2.5 2.5"/></svg>
      </button>
      <button type="button" class="icon" data-format="hr" title="Divider" aria-label="Divider">
        <svg viewBox="0 0 24 24"><path d="M4 12h16M8 7h8M8 17h8"/></svg>
      </button>
    </div>

    <div class="group end" id="modes" role="radiogroup" aria-label="Editing mode">
      <button type="button" role="radio" data-mode="wysiwyg" title="Edit the formatted document">Rich</button>
      <button type="button" role="radio" data-mode="markdown" title="Edit the Markdown source beside a preview">Markdown</button>
    </div>

    <div class="group">
      <button type="button" id="theme" class="icon">
        <svg viewBox="0 0 24 24" class="sun"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
        <svg viewBox="0 0 24 24" class="moon"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main class="main" id="workspace">
    <div id="editor"></div>
  </main>

  <div id="bubble" class="bubble" role="toolbar" aria-label="Formatting" hidden>
    <div class="group">
      <label title="Block style">
        <span class="sr-only">Block style</span>
        <select id="heading">
          <option value="0">Paragraph</option>
          <option value="1">Heading 1</option>
          <option value="2">Heading 2</option>
          <option value="3">Heading 3</option>
          <option value="4">Heading 4</option>
          <option value="5">Heading 5</option>
          <option value="6">Heading 6</option>
        </select>
      </label>
      <button type="button" class="icon" data-format="bold" title="Bold (Ctrl+B)" aria-label="Bold">
        <svg viewBox="0 0 24 24"><path d="M7 5h6a3.5 3.5 0 010 7H7zM7 12h7a3.5 3.5 0 010 7H7z"/></svg>
      </button>
      <button type="button" class="icon" data-format="italic" title="Italic (Ctrl+I)" aria-label="Italic">
        <svg viewBox="0 0 24 24"><path d="M10 5h7M7 19h7M14 5l-4 14"/></svg>
      </button>
      <button type="button" class="icon" data-format="strike" title="Strikethrough" aria-label="Strikethrough">
        <svg viewBox="0 0 24 24"><path d="M4 12h16M16.5 8c0-1.8-1.8-3-4.5-3S7.5 6.2 7.5 8c0 1.2.8 2.2 2.2 2.8M7.5 16c0 1.8 1.8 3 4.5 3s4.5-1.2 4.5-3c0-.7-.3-1.4-.8-1.9"/></svg>
      </button>
      <button type="button" class="icon" data-format="code" title="Inline code" aria-label="Inline code">
        <svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>
      </button>
      <button type="button" class="icon" data-format="link" title="Link (Ctrl+K)" aria-label="Link">
        <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3A4 4 0 0013 5.3l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>
      </button>
    </div>
    <div class="group">
      <button type="button" class="icon" data-format="blockQuote" title="Quote" aria-label="Quote">
        <svg viewBox="0 0 24 24"><path d="M5 6v12M10 8h9M10 12h9M10 16h6"/></svg>
      </button>
      <button type="button" class="icon" data-format="bulletList" title="Bulleted list" aria-label="Bulleted list">
        <svg viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"/></svg>
      </button>
      <button type="button" class="icon" data-format="orderedList" title="Numbered list" aria-label="Numbered list">
        <svg viewBox="0 0 24 24"><path d="M10 7h10M10 12h10M10 17h10M4 5.5L5.5 4.5v4M4 14.5h2.5L4 18h2.5"/></svg>
      </button>
      <button type="button" class="icon" data-format="taskList" title="Task list" aria-label="Task list">
        <svg viewBox="0 0 24 24"><path d="M4 5h6v6H4zM5.5 8l1.2 1.2L8.6 7M13 8h7M4 14h6v6H4zM13 17h7"/></svg>
      </button>
    </div>
  </div>

  <footer class="status">
    <span id="name"></span>
    <span id="count"></span>
    <span id="message"></span>
  </footer>

  <dialog id="discard-dialog">
    <form method="dialog">
      <h2>Unsaved changes</h2>
      <p>Discard the changes to <span id="discard-name"></span>?</p>
      <div class="actions">
        <button value="cancel">Cancel</button>
        <button value="discard" class="primary">Discard</button>
      </div>
    </form>
  </dialog>

  <dialog id="rich-dialog">
    <form method="dialog">
      <h2>Raw HTML</h2>
      <p>Rich mode cannot keep some of the HTML in this document. Switching leaves only its text.</p>
      <div class="actions">
        <button value="cancel">Cancel</button>
        <button value="switch" class="primary">Switch</button>
      </div>
    </form>
  </dialog>

  <dialog id="name-dialog">
    <form method="dialog">
      <h2>Save as</h2>
      <label>Name <input type="text" id="save-name" required></label>
      <div class="actions">
        <button type="button" id="name-cancel">Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="files-dialog">
    <form method="dialog">
      <h2 id="files-title">Open</h2>
      <p id="files-path"></p>
      <div id="files-list" class="files"></div>
      <label id="files-name-label">Name <input type="text" id="files-name"></label>
      <div class="actions">
        <button type="button" id="files-device" title="Use this device's files instead">This device…</button>
        <button type="button" id="files-cancel">Cancel</button>
        <button value="save" class="primary" id="files-save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="link-dialog">
    <form method="dialog">
      <h2>Link</h2>
      <label>Text <input type="text" id="link-text"></label>
      <label>Address <input type="url" id="link-url" placeholder="https://" required></label>
      <div class="actions">
        <button type="button" id="link-cancel">Cancel</button>
        <button value="insert" class="primary">Insert</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/toastui-editor/toastui-editor-all.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
