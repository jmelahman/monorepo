<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>text-editor tests</title>
  <style>
    body { margin: 1.5rem; font: 0.875rem/1.5 ui-monospace, monospace; color-scheme: light dark; }
    h1 { font-size: 1rem; }
    li { list-style: none; white-space: pre-wrap; }
    .fail { color: #c22; }
    /* The editor has to be laid out to work, but there is nothing in it to watch. */
    iframe { position: absolute; left: -200vw; width: 1000px; height: 700px; }
  </style>
</head>
<body>
  <h1 id="summary">Running</h1>
  <ul id="results"></ul>
  <script>
    'use strict';

    // The tests run inside the editor's own page, as that is the only place
    // its functions exist: app.js is one script with no exports, and it wants
    // the page around it and the vendored editor beside it. So the page is
    // opened in a frame and tests.js is added to it as one more script.
    //
    // A frame of the same origin shares the browser's storage with the editor
    // proper, so a draft that was there is put back afterwards. `node
    // test/run.mjs` serves this from a port and a profile of its own, where
    // there is nothing to put back.
    const KEYS = ['text-editor:draft', 'text-editor:mode'];
    const stored = KEYS.map((key) => localStorage.getItem(key));
    const frame = document.createElement('iframe');

    function report(results) {
      frame.remove(); // which saves a draft on its way out
      KEYS.forEach((key, i) => (stored[i] === null ? localStorage.removeItem(key) : localStorage.setItem(key, stored[i])));
      const failed = results.filter((result) => result.error);
      document.getElementById('summary').textContent = `${results.length - failed.length} passed, ${failed.length} failed`;
      document.getElementById('results').append(...results.map(({ name, error }) => {
        const item = document.createElement('li');
        item.textContent = error ? `not ok  ${name}\n        ${error.replace(/\n/g, '\n        ')}` : `ok      ${name}`;
        item.className = error ? 'fail' : '';
        return item;
      }));
      // Only run.mjs is listening; opened by hand, the page is the report.
      fetch('/results', { method: 'POST', body: JSON.stringify(results) }).catch(() => {});
    }

    frame.src = '../index.html';
    frame.addEventListener('load', () => {
      const script = frame.contentDocument.createElement('script');
      script.src = 'test/tests.js';
      script.addEventListener('error', () => report([{ name: 'load tests.js', error: 'It could not be loaded.' }]));
      frame.contentDocument.body.append(script);
    }, { once: true });
    document.body.append(frame);
  </script>
</body>
</html>
