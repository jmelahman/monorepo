default_install_hook_types: [pre-commit, post-checkout, post-merge, post-rewrite]
repos:
  - repo: https://github.com/jmelahman/undot
    rev: a0fbe570d4d793047edb8729a405e9aaf4434581  # frozen: v0.3.0
    hooks:
      - id: undot
  # The Go and solod hooks set GOWORK=off: so/ has its own go.mod, and a
  # go.work further up (a monorepo checkout) would otherwise claim this module.
  # prek builds `so` itself with the Go on PATH; `so` has to be built by the
  # same Go release it runs against, so a host-installed one may not do.
  - repo: local
    hooks:
      - id: check-version
        name: version and pin consistency
        entry: scripts/check-version.sh
        language: system
        always_run: true
        pass_filenames: false
      - id: so-build
        name: build with solod
        entry: env GOWORK=off so build -o undot ./so
        language: golang
        additional_dependencies: [solod.dev/cmd/so@v0.3.0]  # = SOLOD_VERSION
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      - id: go-build
        name: build with go (gocompat)
        entry: env GOWORK=off go build -o undot-go .
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      - id: so-test
        name: test with solod
        entry: env GOWORK=off so test ./so
        language: golang
        additional_dependencies: [solod.dev/cmd/so@v0.3.0]  # = SOLOD_VERSION
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      # Runs after so-test on purpose: so-test regenerates so/test/main.go,
      # which this reads.
      - id: go-test
        name: test with go (gocompat)
        entry: env GOWORK=off go -C so run -modfile=gotest.mod ./test
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
