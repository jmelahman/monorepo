default_install_hook_types: [pre-commit, post-checkout, post-merge, post-rewrite]
repos:
  - repo: https://github.com/jmelahman/undot
    rev: v0.3.0
    hooks:
      - id: undot
  - repo: local
    hooks:
      - id: check-version
        name: version and pin consistency
        entry: scripts/check-version.sh
        language: system
        always_run: true
        pass_filenames: false
      - id: so-build
        name: build with solod
        entry: so build -o undot ./so
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      - id: go-build
        name: build with go (gocompat)
        entry: go build -o undot-go .
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      - id: so-test
        name: test with solod
        entry: so test ./so
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
      # Runs after so-test on purpose: so-test regenerates so/test/main.go,
      # which this reads.
      - id: go-test
        name: test with go (gocompat)
        entry: go -C so run -modfile=gotest.mod ./test
        language: system
        files: '(\.go|\.mod|\.sum)$'
        pass_filenames: false
