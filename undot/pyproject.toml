[project]
name = "undot"
description = "Declutter a project's root directory by taming configuration file sprawl"
license = { file = "LICENSE" }
authors = [{ name = "Jamison Lahman", email = "jamison@lahman.dev" }]
readme = "README.md"
requires-python = ">=3.6"
keywords = ["config", "dotfiles", "git", "pre-commit", "symlink"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Go",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jmelahman/undot"

# Only the packages needed to *import* the build hook live here, pinned
# exactly. The toolchain pins (go-bin, ziglang, solod) are centralized in
# hatch_build.py and declared dynamically via the hook's dependencies().
[build-system]
requires = ["hatch-vcs==0.5.0", "hatchling==1.32.0", "manygo==0.3.0"]
build-backend = "hatchling.build"

# Go/solod sources belong in the sdist only; the wheel carries just the
# built binary (as a script), so nothing from the tree is selected there.
[tool.hatch.build.targets.sdist]
include = [
  "go.mod",
  "**/*.go",
  "so/go.mod",
  "so/go.sum",
  "so/gotest.mod",
  "gocompat/go.mod",
  "scripts/zigcc",
  "build-constraints.txt",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.hooks.custom]
binary_name = "undot"

[tool.hatch.version]
source = "vcs"
