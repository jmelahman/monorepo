[project]
name = "undot"
description = "Declutter a project's root directory by taming configuration file sprawl"
license = { file = "LICENSE" }
authors = [{ name = "Jamison Lahman", email = "jamison@lahman.dev" }]
readme = "README.md"
requires-python = ">=3.6"
keywords = ["config", "dotfiles", "git", "pre-commit", "symlink"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Rust",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jmelahman/undot"

[build-system]
requires = ["maturin==1.16.0"]  # = MATURIN_VERSION in release.yml
build-backend = "maturin"

[tool.maturin]
# Ship the `undot` binary itself; there is no Python extension module.
bindings = "bin"
