[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True
r.RayTracing=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AntiAliasingMethod=4

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
TargetedRHIs=SF_VULKAN_SM6

[ConsoleVariables]
; The vegetation plugin's trees carry their twigs and needles as Nanite assembly parts and
; voxels. Both are needed, and they render correctly on the local Radeon (RADV) as on the 4090.
; Rebuilding the plugin's meshes is what turned trees into cubes, not the GPU (out/nanite_local).
r.Nanite.AllowAssemblies=1
r.Nanite.Foliage=1

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/World/L_World.L_World
EditorStartupMap=/Game/Coast/L_Coast.L_Coast
GlobalDefaultGameMode=/Script/VeloverseUE.RideGameMode


[SystemSettings]
; Mesa 25.0's ACO aborts compiling a precached pipeline ("Unimplemented intrinsic @store_deref").
r.PSOPrecaching=0
; The range of exposures Lumen's cached lighting and the sky capture hold unclipped, outside which
; they clip and a warning shows on screen: N covers EV N-12 to N+8. The game ships L_World, lit by
; the open-world template's sun, where packaged rides measured EV at most 10 on the coast and in
; the desert and -8 to -4 under the mountain (11 Nov), so 3 (EV -9 to 11). The island levels'
; 90000 lux sun reaches EV 15: ride those with -ExecCmds="r.EyeAdaptation.CachedLightingPreExposure 8".
r.EyeAdaptation.CachedLightingPreExposure=3
; None of our landscapes is Nanite, yet with this on, L_World's first -game frame grew to 57 GB
; and the RAM killer took it (5 of 5 rides, 11 Nov). Off, or with grass off, it rides in 2 GB.
landscape.RenderNanite=0

[CoreRedirects]
; The project was OpenCycle (module OpenCycleUE, editor module OpenCycleEditor) until 11 Nov
; 2026. Assets saved before the rename name their classes by the old script packages.
+PackageRedirects=(OldName="/Script/OpenCycleUE",NewName="/Script/VeloverseUE")
+PackageRedirects=(OldName="/Script/OpenCycleEditor",NewName="/Script/VeloverseEditor")
